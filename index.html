<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Minha Vida</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    /* Preto puro, cinzas neutros, cores vivas só onde têm significado */
    --bg: #000000; --side: #000000; --card: #0e0e10; --card-2: #17171a; --line: #222226;
    --fg: #f4f4f5; --muted: #9b9ba1; --dim: #5d5d63;
    --accent: #ff7a1a; --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
    --green: #1ee07f; --purple: #9d5cff; --pink: #ff3d9a; --amber: #ffc21a; --blue: #2f7bff; --red: #ff2d55;
    --on: #000; --r: 14px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f5; --side: #ffffff; --card: #ffffff; --card-2: #f1f1f3; --line: #e4e4e7;
    --fg: #0a0a0b; --muted: #66666d; --dim: #a1a1a8;
    --green: #00b860; --purple: #7b3dff; --pink: #e8177f; --amber: #e0a000; --blue: #1662ff; --red: #f0143c;
    color-scheme: light;
  }
  :root[data-theme="light"] .pf-kpi, :root[data-theme="light"] .pf-card, :root[data-theme="light"] .pf-area, :root[data-theme="light"] .pf-bk { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  :root[data-theme="light"] .pf-nav button:hover { background: rgba(0,0,0,.04); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -.005em; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .pf { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; align-content: start; }
  .pf-side { background: var(--side); border-bottom: 1px solid var(--line); padding: 12px clamp(12px, 3vw, 32px); padding-top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 10px; position: sticky; top: 0; z-index: 5; max-height: 100vh; overflow-y: auto; }
  .pf-topbar { display: flex; align-items: center; gap: 10px; }
  .pf-dotsbtn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--muted); flex: none; }
  .pf-dotsbtn svg { width: 20px; height: 20px; }
  .pf-dotsbtn[aria-expanded="true"] { color: var(--accent); }
  /* Abas laterais (gaveta que entra pela esquerda) */
  .pf-menu { position: fixed; top: 0; left: 0; bottom: 0; z-index: 14; width: min(280px, 82vw); background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; padding-top: max(16px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; transform: translateX(-100%); transition: transform .25s ease; }
  .pf-scrim { position: fixed; inset: 0; z-index: 13; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.menu-on .pf-menu { transform: none; box-shadow: 8px 0 30px rgba(0,0,0,.4); }
  body.menu-on .pf-scrim { opacity: 1; pointer-events: auto; }
  body.menu-on { overflow: hidden; }
  .pf-brand { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; }
  .pf-brand[aria-selected="true"] { background: var(--accent-soft); }
  .pf-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--on); display: grid; place-items: center; font-size: 18px; font-weight: 700; letter-spacing: -.02em; flex: none; }
  .pf-brand strong { display: block; font-size: 15px; font-weight: 600; }
  .pf-brand span { font-size: 12px; color: var(--muted); }
  .pf-nav { display: flex; flex-direction: column; gap: 4px; }
  .pf-nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .pf-nav button svg { width: 18px; height: 18px; flex: none; }
  .pf-nav button:hover { color: var(--fg); background: rgba(255,255,255,.03); }
  .pf-nav button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
  .pf-nav .cnt { margin-left: auto; font-size: 11px; background: var(--red); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .pf-foot { margin-top: auto; }

  .pf-main { padding: 28px clamp(16px, 3vw, 32px) 60px; display: grid; gap: 22px; align-content: start; min-width: 0; }
  .pf-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pf-h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.025em; }
  .pf-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .pf-eye { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); color: var(--muted); flex: none; }
  .pf-eye svg { width: 19px; height: 19px; }
  .pf-eye[aria-pressed="true"] { color: var(--accent); }
  .pf-page { display: grid; gap: 18px; }

  .pf-kpis { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pf-kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pf-kpi, .pf-card, .pf-area { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; overflow: hidden; }
  .pf-kpi { min-height: 130px; gap: 6px; }
  .pf-kpi-top, .pf-card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pf-kpi-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pf-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--glow, var(--accent)) 18%, transparent); color: var(--glow, var(--accent)); flex: none; }
  .pf-ico svg { width: 17px; height: 17px; }
  .pf-kpi-val { font-size: clamp(22px, 2.6vw, 30px); font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.15; }
  .pf-kpi-note { font-size: 12px; color: var(--muted); }
  .pf-hero { --glow: var(--accent); }
  .pf-hero .pf-kpi-val { font-size: clamp(32px, 5vw, 46px); }
  .pf-card-h h2, .pf-area h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .pf-card-note { font-size: 12px; color: var(--muted); margin: -6px 0 0; }
  .pf-row { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  .pf-kpi, .pf-card, .pf-area { grid-template-columns: minmax(0, 1fr); }
  /* Caixas de lançamento compactas */
  .pf-lanc { padding: 14px; gap: 8px; }
  .pf-lanc .pf-money { padding: 6px 12px; border-radius: 12px; }
  .pf-lanc .pf-money span { font-size: 16px; }
  .pf-lanc .pf-money input { font-size: 22px; }
  .pf-lanc .pf-in { padding: 9px 12px; font-size: 14px; border-radius: 10px; }
  .pf-lanc .pf-pick { padding: 6px 11px; font-size: 12px; }
  .pf-lanc .pf-pick.bk { padding: 4px 10px 4px 4px; }
  .pf-lanc .pf-btn { padding: 10px 14px; font-size: 14px; }
  .pf-lanc .pf-picks { gap: 6px; }
  .pf-three { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); }
  .pf-areas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .pf-area-h { display: flex; align-items: center; gap: 10px; }
  .pf-area-h h2 { flex: 1; }
  .pf-open { all: unset; cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 8px; }
  .pf-open:hover { color: var(--accent); background: var(--accent-soft); }
  .pf-stats { margin: 0; display: grid; gap: 10px; }
  .pf-stats div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .pf-stats div:last-child { border-bottom: 0; padding-bottom: 0; }
  .pf-stats dt { font-size: 13px; color: var(--muted); }
  .pf-stats dd { margin: 0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .neg { color: var(--red) !important; }
  .pos { color: var(--green) !important; }
  .sav { color: var(--blue) !important; }

  .pf-empty { display: grid; place-items: center; text-align: center; gap: 8px; color: var(--muted); font-size: 13px; min-height: 100px; border: 1px dashed var(--line); border-radius: 14px; padding: 18px; }
  .pf-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--amber) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--line)); font-size: 14px; }

  /* Barras */
  .pf-track { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
  .pf-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s; }
  .pf-fill.ok { background: var(--green); }
  .pf-fill.warn { background: var(--amber); }
  .pf-fill.bad { background: var(--red); }
  .pf-cats { display: grid; gap: 12px; }
  .pf-cat .n { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
  .pf-cat .n span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pf-cat .pf-track { height: 7px; }
  .pf-cat .pf-fill.red { background: var(--red); }
  .pf-chart svg { display: block; width: 100%; height: auto; }
  .pf-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); }
  .pf-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Formulários */
  .pf-lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: -4px; }
  .pf-in { width: 100%; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; min-width: 0; }
  .pf-in:focus { border-color: var(--accent); }
  textarea.pf-in { resize: vertical; min-height: 70px; }
  .pf-money { display: flex; align-items: baseline; gap: 8px; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; }
  .pf-money:focus-within { border-color: var(--glow, var(--accent)); }
  .pf-money span { color: var(--muted); font-size: 20px; }
  .pf-money input { all: unset; flex: 1; min-width: 0; font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pf-picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pf-pick { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
  .pf-pick[aria-pressed="true"] { color: var(--on); background: var(--glow, var(--accent)); border-color: transparent; font-weight: 600; }
  .pf-pick.bk { padding: 5px 12px 5px 5px; }
  .pf-pick .x { color: var(--dim); font-size: 15px; line-height: 1; padding: 0 2px; }
  .pf-pick .x:hover { color: var(--red); }
  .pf-inline { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) auto; }
  .pf-grid2 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pf-btn { all: unset; cursor: pointer; text-align: center; padding: 13px 18px; border-radius: 12px; background: var(--glow, var(--accent)); color: var(--on); font-weight: 650; font-size: 15px; }
  .pf-btn:active { transform: scale(.98); }
  .pf-btn.ghost { background: var(--card-2); color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
  .pf-btn.small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .pf-btn.danger { background: var(--red); color: #fff; }
  .pf-x { all: unset; cursor: pointer; color: var(--dim); padding: 4px 8px; border-radius: 8px; font-size: 16px; line-height: 1; }
  .pf-x:hover { color: var(--red); background: rgba(255,90,110,.12); }

  /* Listas */
  .pf-list { display: grid; }
  .pf-tx { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pf-tx:last-child { border-bottom: 0; }
  .pf-tx .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-tx small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; white-space: normal; }
  .pf-tx .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pf-dayh { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 16px 0 4px; }
  .pf-dayh:first-child { padding-top: 0; }
  .pf-subh { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .pf-todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .pf-todo li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; border-radius: 12px; background: var(--card-2); font-size: 14px; }
  .pf-check { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--dim); display: grid; place-items: center; }
  .pf-check.done { background: var(--green); border-color: var(--green); color: #0f1a14; }
  .pf-check svg { width: 13px; height: 13px; }
  .done-t { color: var(--dim); text-decoration: line-through; }
  .pf-todo small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pf-todo li.ev { border-left: 4px solid var(--c); }

  .pf-seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .pf-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); width: fit-content; }
  .pf-tabs button { all: unset; cursor: pointer; padding: 9px 18px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  .pf-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pf-navd { display: flex; align-items: center; gap: 10px; }
  .pf-navd b { font-size: 16px; font-weight: 600; flex: 1; text-transform: capitalize; text-align: center; }
  .pf-arrow { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); flex: none; }
  .pf-arrow svg { width: 18px; height: 18px; }

  .pf-goal-nums { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pf-goal-nums b { color: var(--fg); font-weight: 600; }
  .pf-tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
  .pf-tag.late { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .pf-tag.ok { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pf-tag.main { color: var(--accent); background: var(--accent-soft); }
  .pf-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Metas (sistemas) */
  .pf-goallist { display: grid; gap: 14px; }
  .pf-gstats { margin: 0; display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pf-gstats div { background: var(--card-2); border-radius: 12px; padding: 12px; display: grid; gap: 4px; min-width: 0; }
  .pf-gstats dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pf-gstats dd { margin: 0; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .pf-track-m { position: relative; overflow: visible; height: 12px; }
  .pf-mark { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--fg); }
  .pf-sys { background: var(--card-2); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
  .pf-sys-big { font-size: 18px; }
  .pf-sys-big b { font-size: 26px; color: var(--blue); font-variant-numeric: tabular-nums; }
  .pf-alert, .pf-okmsg { font-size: 14px; padding: 10px 12px; border-radius: 10px; line-height: 1.4; }
  .pf-alert { background: color-mix(in srgb, var(--red) 14%, transparent); }
  .pf-alert b { color: var(--red); }
  .pf-okmsg { background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pf-gform { display: grid; gap: 10px; }
  .pf-gcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .pf-gcal .wd { text-align: center; font-size: 11px; color: var(--dim); text-transform: uppercase; padding: 4px 0; aspect-ratio: auto; }
  .pf-gcal span { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font-size: 12px; position: relative; font-variant-numeric: tabular-nums; }
  .pf-gcal .g-ok { background: color-mix(in srgb, var(--green) 26%, transparent); color: var(--green); font-weight: 650; }
  .pf-gcal .g-bad { background: color-mix(in srgb, var(--red) 26%, transparent); color: var(--red); font-weight: 650; }
  .pf-gcal .g-fut, .pf-gcal .g-now { background: var(--card-2); color: var(--muted); }
  .pf-gcal .g-out { color: var(--dim); opacity: .45; }
  .pf-gcal .today { outline: 1.5px solid var(--accent); }
  .pf-gcal .blank { visibility: hidden; }
  .pf-gcal i { position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); }
  @media (max-width: 760px) { .pf-gstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .pf-gcal .g-part { background: color-mix(in srgb, var(--amber) 26%, transparent); color: var(--amber); font-weight: 650; }
  /* Vida */
  .pf-hab { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card-2); border-left: 4px solid var(--c); }
  .pf-hab .pf-todo li { background: var(--card); }
  /* Sino e avisos */
  .pf-head { position: relative; }
  .pf-head-btns { display: flex; gap: 8px; }
  .pf-bell { position: relative; }
  .pf-bell[data-on="true"] { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, var(--line)); }
  .pf-bell .n { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  .pf-pop { position: absolute; right: 0; top: 52px; z-index: 12; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.35); display: grid; gap: 10px; }
  .pf-pop[hidden] { display: none; }
  .pf-pop-h { display: flex; justify-content: space-between; align-items: center; }
  .pf-pop-list { display: grid; gap: 6px; }
  .pf-aviso { all: unset; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--card-2); font-size: 14px; }
  .pf-aviso:hover { outline: 1px solid var(--line); }
  .pf-aviso .pf-dot { margin: 5px 0 0; }
  .pf-aviso small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* Janela de edição */
  .pf-sheet { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 16px; }
  .pf-sheet[hidden] { display: none; }
  .pf-sheet-box { width: min(100%, 460px); max-height: 90vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .pf-tx .acts { display: flex; gap: 2px; }
  .pf-ed { all: unset; cursor: pointer; color: var(--dim); padding: 4px 6px; border-radius: 8px; display: grid; place-items: center; }
  .pf-ed svg { width: 15px; height: 15px; }
  .pf-ed:hover { color: var(--accent); background: var(--accent-soft); }

  /* Agenda */
  .pf-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .pf-cal .wd { text-align: center; font-size: 11px; color: var(--dim); text-transform: uppercase; padding: 4px 0; }
  .pf-cal button { all: unset; cursor: pointer; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 14px; font-variant-numeric: tabular-nums; position: relative; }
  .pf-cal button:hover { background: var(--card-2); }
  .pf-cal button.today { outline: 1.5px solid var(--accent); }
  .pf-cal button.sel { background: var(--accent); color: var(--on); font-weight: 650; }
  .pf-cal button.blank { visibility: hidden; }

function monthChart() {
  const now = new Date(), data = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const [a, b] = monthRange(d);
    data.push({ l: MESES[d.getMonth()].slice(0, 3), ...sums(a, b) });
  }
  const max = Math.max(1, ...data.map(x => Math.max(x.in, x.out)));
  const W = 600, H = 220, base = 190, top = 14, gw = W / 6, bw = 26;
  let g = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  data.forEach((x, i) => {
    const cx = gw * i + gw / 2;
    const hi = (x.in / max) * (base - top), ho = (x.out / max) * (base - top);
    g += `<rect x="${cx - bw - 2}" y="${base - hi}" width="${bw}" height="${hi}" rx="5" fill="var(--green)"><title>Entrou ${brl(x.in)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${base - ho}" width="${bw}" height="${ho}" rx="5" fill="var(--red)"><title>Saiu ${brl(x.out)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="13" fill="var(--muted)">${x.l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entradas e saídas dos últimos 6 meses">${g}</svg>`;
}
function catBars(a, b, bank) {

// ---------- Histórico ----------
function histRange() {
  const h = U.h, r = pd(h.ref);
  if (h.mode === 'dia') return [h.ref, h.ref, fmtLong(h.ref) + ' de ' + r.getFullYear()];
  if (h.mode === 'semana') { const a = weekStart(h.ref), b = addDays(a, 6); return [a, b, fmtShort(a) + ' a ' + fmtShort(b)]; }
  if (h.mode === 'mes') { const [a, b] = monthRange(r); return [a, b, MESES[r.getMonth()] + ' de ' + r.getFullYear()]; }
  if (h.mode === 'ano') return [r.getFullYear() + '-01-01', r.getFullYear() + '-12-31', String(r.getFullYear())];
  const a = h.a <= h.b ? h.a : h.b, b = h.a <= h.b ? h.b : h.a;
  return [a, b, fmtD(a) + ' a ' + fmtD(b)];
}

// ---------- Resumo da semana ----------
function weekChart(a, sel) {
  const data = [...Array(7)].map((_, i) => { const d = addDays(a, i); return { d, ...sums(d, d) }; });
  const max = Math.max(1, ...data.map(x => Math.max(x.in, x.out)));
  const W = 630, H = 240, base = 186, top = 14, gw = W / 7, bw = 22, t = today();
  let g = `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  data.forEach((x, i) => {
    const cx = gw * i + gw / 2, on = x.d === sel;
    const hi = (x.in / max) * (base - top), ho = (x.out / max) * (base - top);
    g += `<g data-act="wkday" data-v="${x.d}" style="cursor:pointer">
      <rect x="${gw * i + 4}" y="2" width="${gw - 8}" height="${H - 4}" rx="14" fill="${on ? 'var(--accent-soft)' : 'transparent'}"/>
      <rect x="${cx - bw - 2}" y="${base - hi}" width="${bw}" height="${Math.max(hi, x.in ? 2 : 0)}" rx="5" fill="var(--green)"><title>Ganhos ${brl(x.in)}</title></rect>
      <rect x="${cx + 2}" y="${base - ho}" width="${bw}" height="${Math.max(ho, x.out ? 2 : 0)}" rx="5" fill="var(--red)"><title>Gastos ${brl(x.out)}</title></rect>
      <text x="${cx}" y="${base + 22}" text-anchor="middle" font-size="13" font-weight="${on ? 700 : 400}" fill="${on ? 'var(--accent)' : 'var(--muted)'}">${SEM[i]}</text>
      <text x="${cx}" y="${base + 40}" text-anchor="middle" font-size="12" fill="${x.d === t ? 'var(--accent)' : 'var(--dim)'}">${pd(x.d).getDate()}</text>
    </g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ganhos e gastos por dia da semana">${g}</svg>`;
}
function vSemana() {

    comp = p === 0 ? 'Gastou o mesmo que na semana passada.' : `Gastou <b class="${p > 0 ? 'neg' : 'pos'}">${Math.abs(p)}% ${p > 0 ? 'a mais' : 'a menos'}</b> que na semana passada (${brl(prev.out)}).`;

    </div>
    <div class="pf-card"><div class="pf-card-h"><h2>Gastos por categoria</h2></div>${catBars(a, b)}</div>
  </div>`;

// ---------- Relatório do mês ----------
// Quanto tinha no total (todos os bancos, em conta + guardado) no fim de um dia
function totalAt(d) {
  let c = 0;
  for (const b of S.banks) c += (b.initConta || 0) + (b.initGuard || 0);
  for (const t of S.tx) if (t.date <= d) { if (t.type === 'in') c += t.cents; else if (t.type === 'out') c -= t.cents; }
  return c;
}
function pctChange(now, before) {
  if (!before) return '';
  const p = Math.round((now - before) / before * 100);
  return p === 0 ? 'igual ao mês anterior' : `${Math.abs(p)}% ${p > 0 ? 'a mais' : 'a menos'} que o mês anterior`;
}
function vRel() {
  const [y, m] = U.rel.split('-').map(Number), ref = new Date(y, m - 1, 1);
  const [a, b] = monthRange(ref), [pa, pb] = monthRange(new Date(y, m - 2, 1));
  const t = today(), end = b < t ? b : t, nome = MESES[m - 1];
  const s = sums(a, b), p = sums(pa, pb), res = s.in - s.out;
  const days = Math.round((pd(end) - pd(a)) / 864e5) + 1;
  const outs = S.tx.filter(x => x.type === 'out' && x.date >= a && x.date <= b);
  // dia que mais gastou e dias sem gasto
  const byDay = {};
  for (const x of outs) byDay[x.date] = (byDay[x.date] || 0) + x.cents;
  const top = Object.entries(byDay).sort((u, v) => v[1] - u[1])[0];
  const noSpend = a > t ? 0 : days - Object.keys(byDay).filter(d => d <= end).length;
  const biggest = [...outs].sort((u, v) => v.cents - u.cents).slice(0, 5);
  // gasto por banco
  const byBank = {};
  for (const x of outs) byBank[x.bank] = (byBank[x.bank] || 0) + x.cents;
  const bankRows = Object.entries(byBank).sort((u, v) => v[1] - u[1]);
  // contas do mês
  const bills = billsInMonth(U.rel), paid = bills.filter(i => i.paid), late = bills.filter(i => !i.paid && i.due < t);
  // metas: quanto guardou pra cada uma no mês
  const goals = S.goals.filter(g => g.kind === 'money').map(g => {
    let c = 0;
    for (const x of S.tx) if (x.goal === g.id && x.date >= a && x.date <= b) c += x.type === 'save' ? x.cents : x.type === 'unsave' ? -x.cents : 0;
    return { g, c, s: goalSys(g) };
  }).filter(o => o.c || !o.g.done);
  // vida: cumprimento de cada sistema no mês
  const habs = habRange(a, end);
  const patr = totalAt(end), patrPrev = totalAt(pb);
  const lim = S.cfg.limit;
  return `<div class="pf-card"><div class="pf-navd"><button class="pf-arrow" data-act="relshift" data-v="-1" aria-label="Mês anterior">${IC.left}</button><b>${nome} de ${y}</b><button class="pf-arrow" data-act="relshift" data-v="1" aria-label="Próximo mês">${IC.right}</button></div>
    <p style="margin:0;font-size:15px;line-height:1.5">Em ${nome} você ganhou <b class="pos">${brl(s.in)}</b>, gastou <b class="neg">${brl(s.out)}</b> e guardou <b class="sav">${brl(s.sv)}</b>. ${res >= 0 ? `Sobraram <b class="pos">${brl(res)}</b>.` : `Gastou <b class="neg">${brl(-res)}</b> a mais do que ganhou.`}${b >= t && a <= t ? ' <span class="pf-tag main">mês em andamento</span>' : ''}</p>
  </div>
  <div class="pf-kpis">
    <div class="pf-kpi" style="--glow:var(--green)"><span class="pf-kpi-label">Entrou</span><span class="pf-kpi-val pos">${brl(s.in)}</span><span class="pf-kpi-note">${pctChange(s.in, p.in) || plural(s.nIn, 'ganho', 'ganhos')}</span></div>
    <div class="pf-kpi" style="--glow:var(--red)"><span class="pf-kpi-label">Saiu</span><span class="pf-kpi-val neg">${brl(s.out)}</span><span class="pf-kpi-note">${pctChange(s.out, p.out) || plural(s.nOut, 'gasto', 'gastos')}</span></div>
    <div class="pf-kpi" style="--glow:var(--blue)"><span class="pf-kpi-label">Guardei</span><span class="pf-kpi-val sav">${brl(s.sv)}</span><span class="pf-kpi-note">${pctChange(s.sv, p.sv) || 'guardado menos tirado'}</span></div>
    <div class="pf-kpi" style="--glow:var(--accent)"><span class="pf-kpi-label">Tinha no total no fim</span><span class="pf-kpi-val">${brl(patr)}</span><span class="pf-kpi-note">${patr - patrPrev >= 0 ? 'cresceu' : 'diminuiu'} <b class="${patr - patrPrev >= 0 ? 'pos' : 'neg'}">${brl(Math.abs(patr - patrPrev))}</b> no mês</span></div>
  </div>
  ${lim ? `<div class="pf-card"><div class="pf-card-h"><h2>Limite de gasto</h2><span class="pf-tag ${s.out > lim ? 'late' : 'ok'}">${s.out > lim ? 'passou ' + brl(s.out - lim) : 'dentro do limite'}</span></div>
    <div class="pf-track"><div class="pf-fill ${s.out / lim >= .9 ? 'bad' : s.out / lim >= .7 ? 'warn' : 'ok'}" style="width:${Math.min(100, s.out / lim * 100)}%"></div></div>
    <div class="pf-goal-nums"><span>Gastei <b>${brl(s.out)}</b></span><span>Limite <b>${brl(lim)}</b></span></div></div>` : ''}
  <div class="pf-row">
    <div class="pf-card"><div class="pf-card-h"><h2>Pra onde foi o dinheiro</h2></div>${catBars(a, b)}</div>
    <div class="pf-card"><div class="pf-card-h"><h2>Números do mês</h2></div>
      <dl class="pf-stats">
        <div><dt>Gasto médio por dia</dt><dd>${brl(Math.round(s.out / Math.max(1, days)))}</dd></div>
        <div><dt>Dia que mais gastei</dt><dd>${top ? `${brl(top[1])} <small class="pf-kpi-note">${fmtShort(top[0])}</small>` : '—'}</dd></div>
        <div><dt>Dias sem gastar nada</dt><dd>${noSpend}</dd></div>
        <div><dt>Contas pagas</dt><dd>${paid.length} de ${bills.length}</dd></div>
        <div><dt>Contas atrasadas</dt><dd class="${late.length ? 'neg' : ''}">${late.length}</dd></div>
      </dl></div>
  </div>
  <div class="pf-row">
    <div class="pf-card"><div class="pf-card-h"><h2>Maiores gastos</h2></div>

function vRecap(wk) {

  const last = step(wk ? weekStart(t) : t.slice(0, 7) + '-01', -1); // último período já fechado
  const sel = U.rc[k] || last, first = recapStart();

// ---------- Agenda ----------
// Repetições: um compromisso marcado uma vez vale pra vários dias.
const REP = [['none', 'Não repete'], ['daily', 'Todo dia'], ['every', 'A cada X dias'], ['weekly', 'Dias da semana'], ['monthly', 'Todo mês'], ['yearly', 'Todo ano']];
const isRep = e => e.rep && e.rep.type !== 'none';
const lastDay = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
function occursOn(e, d) {

  const r = e.rep;
  if ((r.until && d > r.until) || (e.skip && e.skip[d])) return false;
  const a = pd(e.date), b = pd(d);
  switch (r.type) {
    case 'daily': return true;
    case 'every': return dayIdx(e.date, d) % Math.max(1, r.n || 1) === 0;
    case 'weekly': return (r.days || []).includes((b.getDay() + 6) % 7);
    case 'monthly': return b.getDate() === Math.min(a.getDate(), lastDay(b));
    case 'yearly': return b.getMonth() === a.getMonth() && b.getDate() === Math.min(a.getDate(), lastDay(b));
  }

}
// Compromissos de um dia (cada repetição tem o seu "feito")
function evOn(d) {

    .map(e => ({ ...e, date: d, done: isRep(e) ? !!(e.doneDates && e.doneDates[d]) : e.done }))
    .sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
function evBetween(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(...evOn(d)); return out; }

  if (!isRep(e)) return '';
  const r = e.rep, orig = find(S.events, e.id) || e;
  const l = { daily: 'todo dia', every: `a cada ${r.n} dias`, weekly: (r.days || []).map(i => SEM[i]).join(', '),
    monthly: `todo dia ${pd(orig.date).getDate()}`, yearly: `todo ano em ${fmtShort(orig.date)}` }[r.type];
  return '↻ ' + l + (r.until ? ' até ' + fmtD(r.until) : '');
}
function vAgenda() {
  const ag = U.ag, [y, m] = ag.month.split('-').map(Number);

  const mBills = billsInMonth(ag.month);
  // cores de cada dia (sem repetir, no máximo 4 fitas). Conta pendente = vermelho.
  const dayColors = {};

// ---------- Metas de vida (sistemas) ----------
// A meta vira um sistema: o valor é dividido pelos dias até a data, e cada dia mostra se o total guardado está em dia.

// ---------- Vida (sistemas de hábitos) ----------
// Mesma regra das metas: o sistema diz o que fazer em cada dia; dia feito = verde, dia perdido = vermelho.
const VAREAS = { Corpo: '#ff7a1a', Mente: '#9d5cff', Estudo: '#ffc21a', Trabalho: '#ff3d9a', Casa: '#2f7bff', Outros: '#1ee07f' };

function habCal(h) {

const taskLate = x => !x.done && x.date && x.date < today();

// ---------- Hoje: o botão VIDA abre o dia e junta tudo ----------
function dayBrief(t) {
  const pagar = billInst().filter(i => !i.paid && i.due <= t).sort((a, b) => a.due.localeCompare(b.due));
  const guardar = S.goals.filter(g => g.kind === 'money' && !g.done && g.deadline).map(g => {
    const s = goalSys(g); return { title: g.title, sub: 'até ' + fmtD(g.deadline), c: s.complete ? 0 : Math.max(0, s.expAt(t > g.deadline ? g.deadline : t) - s.saved) };
  }).filter(x => x.c > 0);  const ev = evOn(t), hab = S.habits.filter(h => h.start <= t && habOn(h, t)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  const tasks = S.tasks.filter(x => !x.done && (!x.date || x.date <= t)).sort(taskSort);
  const doneToday = S.tasks.filter(x => x.done && x.doneAt === t);
  return { pagar, guardar, ev, hab, tasks, doneToday, sum: a => a.reduce((s, x) => s + x, 0) };
}
// ---------- Consultor: olha o histórico e diz até onde dá pra gastar ----------
function advisor() {
  const t = today(), [ma, mb] = monthRange();
  let conta = 0; for (const bk of S.banks) conta += balance(bk.id).conta;
  const contas = billSummary().total;
  const metas = S.goals.filter(g => g.kind === 'money' && !g.done && g.deadline).reduce((s, g) => {
    const x = goalSys(g); return s + (x.complete ? 0 : Math.max(0, x.expAt(g.deadline < mb ? g.deadline : mb) - x.saved));
  }, 0);
  const outHoje = sums(t, t).out, diasRest = dayIdx(t, mb) + 1;
  const livre = conta - contas - metas;
  const porDia = Math.max(0, Math.floor((livre + outHoje) / diasRest)), restaHoje = porDia - outHoje;
  const out30 = sums(addDays(t, -30), addDays(t, -1)).out, media = Math.round(out30 / 30);
  const passados = dayIdx(ma, t) + 1, outMes = sums(ma, t).out, proj = Math.round(outMes / passados * (dayIdx(ma, mb) + 1));
  const ws = weekStart(t), semana = sums(ws, t).out, diasSem = dayIdx(ws, t) + 1;
  let ant = 0; for (let i = 1; i <= 4; i++) ant += sums(addDays(ws, -7 * i), addDays(ws, -7 * i + diasSem - 1)).out;
  ant = Math.round(ant / 4);
  // categoria que mais subiu: últimos 30 dias contra os 30 anteriores
  const byCat = (a, b) => { const o = {}; for (const x of S.tx) if (x.type === 'out' && x.date >= a && x.date <= b) o[x.cat || 'Outros'] = (o[x.cat || 'Outros'] || 0) + x.cents; return o; };
  const c1 = byCat(addDays(t, -29), t), c0 = byCat(addDays(t, -59), addDays(t, -30));
  const up = Object.entries(c1).map(([c, v]) => ({ c, v, p: c0[c] ? (v - c0[c]) / c0[c] * 100 : 0, d: v - (c0[c] || 0) })).filter(x => x.p >= 40 && x.d >= 3000).sort((a, b) => b.d - a.d)[0];
  const msgs = [];
  if (!S.tx.length) msgs.push({ lvl: 'info', t: 'Ainda sem histórico', s: 'Lance os gastos e ganhos e eu começo a te avisar.' });
  if (conta < 0) msgs.push({ lvl: 'bad', t: `Conta no negativo: ${brl(conta)}`, s: 'Saiu mais do que entrou. Confira se faltou lançar algum ganho, ou segure os gastos.' });
  else if (livre < 0) msgs.push({ lvl: 'bad', t: `Faltam ${brl(-livre)} pro mês fechar`, s: `Contas (${brl(contas)}) + metas (${brl(metas)}) passam do que tem em conta (${brl(conta)}). Segura os gastos.` });
  else if (restaHoje < 0) msgs.push({ lvl: 'bad', t: `Hoje passou ${brl(-restaHoje)} do que podia`, s: `O mês aguenta ${brl(porDia)} por dia. Amanhã fica menor.` });
  else msgs.push({ lvl: 'ok', t: `Pode gastar até ${brl(restaHoje)} hoje`, s: `Já tirando contas e metas do mês. Dá ${brl(porDia)} por dia até o dia ${pd(mb).getDate()}.` });
  if (media > porDia && out30) msgs.push({ lvl: 'warn', t: `Você costuma gastar ${brl(media)} por dia`, s: `O mês só aguenta ${brl(porDia)}. Corte ${brl(media - porDia)} por dia.` });
  if (S.cfg.limit && proj > S.cfg.limit) msgs.push({ lvl: 'warn', t: `Nesse ritmo fecha o mês com ${brl(proj)} gastos`, s: `Passa ${brl(proj - S.cfg.limit)} do limite de ${brl(S.cfg.limit)}.` });
  if (ant && semana > ant * 1.3 && semana - ant >= 2000) msgs.push({ lvl: 'warn', t: `Semana ${Math.round((semana / ant - 1) * 100)}% acima do normal`, s: `Gastou ${brl(semana)} até agora; costuma ser ${brl(ant)} nesse ponto da semana.` });
  if (up) msgs.push({ lvl: 'warn', t: `${up.c} subiu ${Math.round(up.p)}%`, s: `${brl(up.v)} nos últimos 30 dias, ${brl(up.d)} a mais que nos 30 anteriores.` });
  return { conta, contas, metas, livre, porDia, restaHoje, outHoje, media, proj, msgs };
}
function advisorCard(full) {
  const a = advisor(), col = { ok: 'var(--green)', warn: 'var(--amber)', bad: 'var(--red)', info: 'var(--blue)' };
  const p = a.porDia ? Math.min(100, a.outHoje / a.porDia * 100) : (a.outHoje ? 100 : 0);
  return `<div class="pf-card pf-glow" style="--glow:${a.restaHoje < 0 || a.livre < 0 ? 'var(--red)' : 'var(--green)'}">

// ---------- Painel geral: um resumo de cada aba ----------
function vGeral() {
  const t = today(), day = S.days[t], b = dayBrief(t);
  const total = b.ev.length + b.hab.length + b.tasks.length + b.doneToday.length, feito = b.ev.filter(e => e.done).length + b.hab.filter(h => habState(h, t) === 'ok').length + b.doneToday.length;
  let conta = 0, guard = 0; for (const bk of S.banks) { const x = balance(bk.id); conta += x.conta; guard += x.guard; }
  const [ma, mb] = monthRange(), m = sums(ma, mb), bs = billSummary(), a = advisor();
  const dem = S.tasks.filter(x => isDem(x) && !x.done), demHoje = dem.filter(x => x.date && x.date <= t), demMes = S.tasks.filter(x => isDem(x) && x.done && x.doneAt >= ma);
  const lendo = S.know.books.filter(x => x.status === 'lendo'), cs = S.know.courses.filter(nextLesson), yr = t.slice(0, 4);

    + (dem.length ? `<ul class="pf-todo">${dem.sort(taskSort).slice(0, 3).map(x => `<li class="ev" style="grid-template-columns:1fr;--c:${kindColor(x.kind)}"><span>${esc(x.t)}<small>${esc(x.kind || '')}${x.date ? ' · ' + (x.date === t ? 'hoje' : fmtShort(x.date)) : ''}</small></span></li>`).join('')}</ul>` : '');

// ---------- MORTE: fecha o dia ----------
function closeDay(d) {
  const s = sums(d, d), day = S.days[d] || (S.days[d] = { start: '' });
  const ev = evOn(d), hab = S.habits.filter(h => h.start <= d && habOn(h, d));
  day.end = d === today() ? new Date().toTimeString().slice(0, 5) : '—';
  day.sum = { in: s.in, out: s.out, sv: s.sv };
  day.done = [...S.tasks.filter(x => x.done && x.doneAt === d).map(x => x.t), ...ev.filter(e => e.done).map(e => e.title), ...hab.filter(h => habState(h, d) === 'ok').map(h => h.title),
    ...S.know.courses.flatMap(c => c.lessons.filter(l => l.done && l.doneAt === d).map(l => 'Aula: ' + l.t))];
  day.missed = [...ev.filter(e => !e.done).map(e => e.title), ...hab.filter(h => habState(h, d) !== 'ok').map(h => h.title)];
}
// últimos 14 dias: verde = fechou no MORTE, vermelho = abriu e não fechou, cinza = nem abriu
function dayStrip() {
  const t = today(); let h = '';
  for (let i = 13; i >= 0; i--) {
    const d = addDays(t, -i), x = S.days[d], cls = x && x.end ? 'ok' : x ? (d === t ? 'now' : 'bad') : 'off';
    h += `<span class="${cls} ${d === t ? 'today' : ''}" title="${fmtShort(d)}">${pd(d).getDate()}</span>`;
  }
  return `<div class="pf-dstrip">${h}</div><div class="pf-legend"><span><i style="background:var(--green)"></i>fechou no MORTE</span><span><i style="background:var(--red)"></i>ficou aberto</span><span><i style="background:var(--dim)"></i>não abriu</span></div>`;
}

const demOn = d => S.tasks.filter(x => isDem(x) && x.date === d).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));

// ---------- Central de avisos (sino) ----------
function avisos() {
  const t = today(), out = [];
  const bs = billSummary();
  for (const i of bs.pend.filter(i => i.due <= addDays(t, 3)).sort((a, b) => a.due.localeCompare(b.due))) {
    const d = daysUntil(i.due);
    out.push({ k: `bill:${i.b.id}:${i.key}:${d < 0 ? 'late' : d === 0 ? 'hoje' : 'perto'}`, lvl: d < 0 ? 'bad' : d === 0 ? 'bad' : 'warn', go: 'contas', t: `${i.b.name} · ${brl(i.b.cents)}`,
      s: d < 0 ? `Conta atrasada há ${plural(-d, 'dia', 'dias')}` : d === 0 ? 'Conta vence hoje' : `Conta vence em ${plural(d, 'dia', 'dias')} (${fmtShort(i.due)})` });
  }
  for (const g of S.goals.filter(goalBehind)) {
    const s = goalSys(g);
    out.push({ k: `goal:${g.id}:${t}`, lvl: 'bad', go: 'metas', t: `Meta ${g.title}: devendo ${brl(-s.diff)}`, s: `Guarde ${brl(-s.diff)} hoje pra ficar em dia, ou ${brl(s.rate)} por dia até ${fmtD(g.deadline)}` });
  }
  for (const h of S.habits) {
    if (h.start > t) continue;
    const y = addDays(t, -1);
    if (habOn(h, y) && h.start <= y && habState(h, y) !== 'ok') out.push({ k: `hab:${h.id}:${y}`, lvl: 'bad', go: 'vida', t: `${h.title}: ontem ficou ${habState(h, y) === 'part' ? 'pela metade' : 'sem fazer'}`, s: 'Hoje é dia de voltar pro sistema' });
    if (habOn(h, t) && habState(h, t) !== 'ok') out.push({ k: `hab:${h.id}:${t}`, lvl: 'info', go: 'vida', t: `Hoje: ${h.title}`, s: freqLabel(h) });
  }
  for (const d of openDays()) out.push({ k: `morte:${d}`, lvl: 'bad', go: 'hoje', t: `${fmtShort(d)} ficou sem MORTE`, s: 'Feche o dia no VIDA' });
  { const a = advisor(); if (S.tx.length && (a.restaHoje < 0 || a.livre < 0)) out.push({ k: `adv:${t}:${a.livre < 0 ? 'mes' : 'dia'}`, lvl: 'bad', go: 'painel', t: a.msgs[0].t, s: a.msgs[0].s }); }
  for (const x of S.tasks.filter(x => !x.done && x.date && x.date <= addDays(t, 1))) {
    const dd = daysUntil(x.date), tipo = isDem(x) ? (x.kind || 'Trabalho') : 'Pendência';
    out.push({ k: `task:${x.id}:${dd < 0 ? 'late' : x.date}`, lvl: dd < 0 ? 'bad' : dd === 0 ? 'warn' : 'info', go: isDem(x) ? 'trab' : 'pend', t: `${tipo}: ${x.t}`,
      s: dd < 0 ? `Atrasada há ${plural(-dd, 'dia', 'dias')}` : (dd === 0 ? 'Hoje' : 'Amanhã') + (x.time ? ' às ' + x.time : '') });
  }
  for (const e of evOn(t).filter(e => !e.done)) out.push({ k: `ev:${e.id}:${t}`, lvl: 'info', go: 'agenda', t: `Hoje: ${e.title}`, s: e.time || 'dia todo' });
  for (const e of evOn(addDays(t, 1)).filter(e => !e.done)) out.push({ k: `ev:${e.id}:${addDays(t, 1)}:am`, lvl: 'info', go: 'agenda', t: `Amanhã: ${e.title}`, s: e.time || 'dia todo' });
  if (S.cfg.limit) {
    const [a, b] = monthRange(), o = sums(a, b).out, p = o / S.cfg.limit * 100;
    if (p >= 90) out.push({ k: `lim:${a}:${p >= 100 ? 100 : 90}`, lvl: p >= 100 ? 'bad' : 'warn', go: 'painel', t: p >= 100 ? 'Passou do limite de gasto do mês' : `Já usou ${Math.round(p)}% do limite do mês`, s: `${brl(o)} de ${brl(S.cfg.limit)}` });
  }
  const lb = S.cfg.lastBackup ? -daysUntil(S.cfg.lastBackup) : null;
  if ((S.tx.length || S.bills.length) && (lb === null || lb >= 7)) out.push({ k: `bkp:${t}`, lvl: 'warn', go: 'ajustes', t: 'Salve um backup', s: lb === null ? 'Você nunca salvou um backup' : `Último backup há ${lb} dias` });
  S.av.hid = S.av.hid.filter(k => out.some(a => a.k === k)); // esquece os limpos que já sumiram sozinhos
  return out.filter(a => !S.av.hid.includes(a.k));
}

// Protege contra quem pegar o aparelho. Guarda só um código da senha, não a senha em si.
function hashPin(p) {
  let h = 2166136261 >>> 0;
  const s = 'vida-app:' + p;
  for (let r = 0; r < 800; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16);
}
let pinBuf = '', unlocked = !S.cfg.pin, hiddenAt = 0;
function drawDots() { $('#dots').innerHTML = [...Array(S.cfg.pinLen || 4)].map((_, i) => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join(''); }
function lock() { if (!S.cfg.pin) return; unlocked = false; pinBuf = ''; $('#lock').hidden = false; $('#lock-logo').textContent = S.cfg.name.charAt(0).toUpperCase(); drawDots(); }
function pinKey(k) {

// O app monta os avisos dos próximos 7 dias e manda pro servidor, que avisa o celular na hora certa.
// Fica salvo só neste aparelho (não vai no backup), porque cada aparelho tem a sua inscrição.
const PUSH_SERVER = 'https://vida-push.vida-push.workers.dev';
const VAPID_PUBLIC = 'BLCNWyLtUetWYpu_JT9LZ59H2GV6EeQUlL7f8C507zUs13xtb0w32aLBtIcIwumTeql9uKZ0rknfYWeacXZww9c';
const DEV_KEY = 'vida-dev';
const NOTIF_DEF = { on: false, contas: true, agenda: true, vida: true, metas: true, hContas: '09:00', hMetas: '20:00' };
function devCfg() {
  let d;
  try { d = JSON.parse(localStorage.getItem(DEV_KEY)); } catch (e) {}
  if (!d || !d.id) {
    const rnd = () => [...crypto.getRandomValues(new Uint8Array(18))].map(x => x.toString(36).padStart(2, '0')).join('').slice(0, 32);
    d = { id: rnd(), token: rnd(), ...NOTIF_DEF };

}

const notifReady = () => 'serviceWorker' in navigator && 'PushManager' in window && location.protocol === 'https:';
const atTime = (d, hm) => { const [h, m] = (hm || '09:00').split(':').map(Number); const x = pd(d); x.setHours(h, m, 0, 0); return x.getTime(); };

function buildReminders() {
  const n = devCfg(), t = today(), end = addDays(t, 7), out = [];
  if (n.contas) {
    const seen = new Set(), list = [];
    for (const i of [...billInst(), ...billsBetween(t, addDays(end, 1))]) {
      const k = i.b.id + ':' + i.key;
      if (!i.paid && !seen.has(k)) { seen.add(k); list.push(i); }
    }
    for (let d = t; d <= end; d = addDays(d, 1)) for (const i of list) {
      const late = dayIdx(i.due, d), money = brlRaw(i.b.cents);
      let body = null;
      if (i.due === addDays(d, 1)) body = `${money} vence amanhã`;
      else if (i.due === d) body = `${money} vence hoje`;
      else if (late > 0) body = `${money} atrasada há ${plural(late, 'dia', 'dias')}`;
      if (body) out.push({ k: `bill:${i.b.id}:${i.key}:${d}`, at: atTime(d, n.hContas), title: `Conta: ${i.b.name}`, body, go: 'contas' });
    }
  }
  if (n.agenda) for (const e of evBetween(t, end)) {
    if (e.done) continue;
    out.push({ k: `ev:${e.id}:${e.date}`, at: e.time ? atTime(e.date, e.time) - 30 * 6e4 : atTime(e.date, '08:00'),
      title: e.title, body: (e.time ? `Às ${e.time}` : 'Hoje') + (e.notes ? ' · ' + e.notes : ''), go: 'agenda' });
  }
  // pendências e demandas com data: avisa 30 min antes (ou 8h) e lembra as atrasadas
  if (n.agenda) for (const x of S.tasks) {
    if (x.done || !x.date) continue;
    const tipo = isDem(x) ? (x.kind || 'Trabalho') : 'Pendência';
    for (let d = x.date < t ? t : x.date; d <= end; d = addDays(d, 1)) {
      const late = dayIdx(x.date, d);
      if (late < 0) break;
      out.push({ k: `task:${x.id}:${d}`, at: late === 0 && x.time ? atTime(d, x.time) - 30 * 6e4 : atTime(d, '08:00'), title: `${tipo}: ${x.t}`,
        body: late > 0 ? `Atrasada há ${plural(late, 'dia', 'dias')}` : x.time ? `Às ${x.time}` : 'Pra hoje', go: isDem(x) ? 'trab' : 'pend' });
    }
  }
  if (n.vida) for (const h of S.habits) for (let d = t > h.start ? t : h.start; d <= end && (!h.until || d <= h.until); d = addDays(d, 1)) {
    if (!habOn(h, d) || habState(h, d) === 'ok') continue;
    const items = habItems(h, d).map(i => i.t);
    out.push({ k: `hab:${h.id}:${d}`, at: h.time ? atTime(d, h.time) - 15 * 6e4 : atTime(d, '08:00'),
      title: `Hora de: ${h.title}${h.time ? ' (' + h.time + (h.timeEnd ? '–' + h.timeEnd : '') + ')' : ''}`,
      body: items.length ? items.slice(0, 4).join(' · ') + (items.length > 4 ? '…' : '') : 'Siga o sistema hoje.', go: 'vida' });
  }
  if (n.metas) for (const g of S.goals) {
    if (g.kind !== 'money' || g.done || !g.deadline) continue;
    const s = goalSys(g);
    if (s.complete) continue;
    // conta como se nada mais fosse guardado; se você guardar, o app atualiza os avisos
    for (let d = t; d <= end && d <= g.deadline; d = addDays(d, 1)) {
      const need = s.expAt(d) - s.saved;
      if (need > 0) out.push({ k: `goal:${g.id}:${d}`, at: atTime(d, n.hMetas), title: `Meta: ${g.title}`, body: `Guarde ${brlRaw(need)} hoje pra ficar em dia`, go: 'metas' });
    }
  }
  const now = Date.now() - 6e4;
  return out.filter(r => r.at > now).sort((a, b) => a.at - b.at).slice(0, 300);
}

var syncTimer = null, lastSync = ''; // var: save() pode chamar antes desta linha rodar

      if (b.group && S.bills.filter(x => x.group === b.group).length > 1) {
        if (confirm(`Apagar só a parcela "${b.name}"?\n\nOK = só essa · Cancelar = outras opções`)) S.bills = S.bills.filter(x => x.id !== id);
        else if (confirm('Apagar TODAS as parcelas dessa compra?')) S.bills = S.bills.filter(x => x.group !== b.group);
        else return 'keep';
      } else if (confirm(`Apagar a conta "${b.name}"?`)) S.bills = S.bills.filter(x => x.id !== id);
      else return 'keep';
    },
    deltx() { if (confirm('Apagar esse lançamento?')) S.tx = S.tx.filter(t => t.id !== id); },
    hmode() { U.h.mode = v; },
    hshift() {
      const n = +v, h = U.h, d = pd(h.ref);
      if (h.mode === 'dia') h.ref = addDays(h.ref, n);
      else if (h.mode === 'semana') h.ref = addDays(h.ref, 7 * n);
      else if (h.mode === 'mes') h.ref = iso(new Date(d.getFullYear(), d.getMonth() + n, 1));
      else h.ref = iso(new Date(d.getFullYear() + n, 0, 1));
    },
    wkshift() {
      U.wk.ref = addDays(U.wk.ref, 7 * v);
      const a = weekStart(U.wk.ref), t = today();
      U.wk.sel = t >= a && t <= addDays(a, 6) ? t : a;
    },
    wkday() { U.wk.sel = v; },
    rcopen() { U.rc[el.dataset.k] = v; window.scrollTo(0, 0); },
    relshift() { const [y, m] = U.rel.split('-').map(Number); U.rel = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7); },
    bt() { U.bt = v; },
    cmshift() { const [y, m] = (U.cm || today().slice(0, 7)).split('-').map(Number); U.cm = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7); },
    billpay() {
      const b = find(S.bills, id), key = el.dataset.key;
      if (isPaid(b, key)) {
        const rec = key === 'v' ? b.paid : b.paid[key];
        if (typeof rec === 'string' && confirm('Desfazer o pagamento? O gasto registrado também vai ser apagado.')) S.tx = S.tx.filter(t => t.id !== rec);
        else if (typeof rec === 'string') return 'keep';
        if (key === 'v') b.paid = false; else delete b.paid[key];
      } else {
        let rec = true;
        const mb = find(S.banks, b.bank) || find(S.banks, S.cfg.main);
        if (mb && confirm(`Registrar ${brlRaw(b.cents)} como gasto no ${mb.name}?\n\nOK = sim · Cancelar = só marcar como paga`)) {
          rec = uid();
          S.tx.push({ id: rec, type: 'out', cents: b.cents, bank: mb.id, cat: b.cat || (S.cfg.catsOut.includes('Contas') ? 'Contas' : ''), desc: b.name, date: today() });
        }

    billdel() { if (confirm('Apagar essa conta fixa? Ela some de todos os meses.')) S.bills = S.bills.filter(b => b.id !== id); },
    billgdel() { if (confirm('Apagar TODAS as parcelas dessa conta?')) S.bills = S.bills.filter(b => b.group !== id); else return 'keep'; },
    debtpay() {
      const dv = find(S.debts, id), l = debtLeft(dv);
      const s = prompt(`Quanto você pagou de "${dv.name}"? (falta ${brlRaw(l)})`, '');
      if (s === null) return 'keep';
      const c = Math.min(parseMoney(s), l);
      if (!(c > 0)) { toast('Escreva o valor'); return 'keep'; }
      const p = { cents: c, date: today() };
      const mb = find(S.banks, S.cfg.main);
      if (mb && confirm(`Registrar ${brlRaw(c)} como gasto no ${mb.name}?\n\nOK = sim · Cancelar = só abater`)) {

      }

    },
    debtundo() {
      const dv = find(S.debts, id), p = dv.pays[dv.pays.length - 1];
      if (!confirm(`Desfazer o último pagamento (${brlRaw(p.cents)} em ${fmtD(p.date)})?${p.tx ? ' O gasto registrado também vai ser apagado.' : ''}`)) return 'keep';
      if (p.tx) S.tx = S.tx.filter(t => t.id !== p.tx);

    },
    debtdel() { if (confirm('Apagar essa dívida? Os gastos já registrados continuam.')) S.debts = S.debts.filter(x => x.id !== id); else return 'keep'; },
    saltg() { const i = find(S.sal, id); i.sure = !i.sure; },
    saldel() { S.sal = S.sal.filter(i => i.id !== id); },
    smshift() { const [y, m] = (U.sm || today().slice(0, 7)).split('-').map(Number); U.sm = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7); },
    shoptg() { const i = find(S.shop, id); i.done = !i.done; },
    shopdel() { S.shop = S.shop.filter(i => i.id !== id); },
    shopclear() { S.shop = S.shop.filter(i => !i.done); },
    gmonth() {
      const g = find(S.goals, id), t = today();
      const cur = U.gm[id] || (t < g.start ? g.start : t > g.deadline ? g.deadline : t).slice(0, 7);
      const [y, m] = cur.split('-').map(Number);
      U.gm[id] = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7);
    },
    gedit() {
      const g = find(S.goals, id);
      const c = prompt(`Quanto custa "${g.title}"?`, (g.cents / 100).toFixed(2).replace('.', ','));
      if (c === null) return 'keep';
      const dt = prompt('Até quando quer realizar? (dia/mês/ano)', g.deadline ? fmtD(g.deadline) : '');
      if (dt === null) return 'keep';
      const nc = parseMoney(c), mt = dt.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!(nc > 0)) { alert('Valor inválido'); return 'keep'; }
      if (dt.trim() && !mt) { alert('Escreva a data assim: 30/06/2027'); return 'keep'; }
      const nd = mt ? `${mt[3]}-${pad(mt[2])}-${pad(mt[1])}` : '';
      if (nd && nd < g.start) { alert('A data precisa ser depois do começo da meta (' + fmtD(g.start) + ').'); return 'keep'; }
      g.cents = nc; g.deadline = nd;
      toast('Meta atualizada');
    },
    agday() { U.ag.sel = v; },
    agmonth() { const [y, m] = U.ag.month.split('-').map(Number); U.ag.month = iso(new Date(y, m - 1 + +v, 1)).slice(0, 7); },
    evtg() {
      const ev = find(S.events, id), d = el.dataset.d;
      if (isRep(ev)) { const m = ev.doneDates || (ev.doneDates = {}); if (m[d]) delete m[d]; else m[d] = true; }
      else ev.done = !ev.done;
    },
    evdel() {
      const ev = find(S.events, id), d = el.dataset.d;
      if (!isRep(ev)) { if (!confirm('Apagar esse compromisso?')) return 'keep'; S.events = S.events.filter(x => x.id !== id); return; }
      if (confirm(`Apagar "${ev.title}" só no dia ${fmtD(d)}?\n\nOK = só esse dia · Cancelar = outras opções`)) { (ev.skip || (ev.skip = {}))[d] = true; return; }
      if (confirm('Apagar a repetição inteira (todos os dias)?')) S.events = S.events.filter(x => x.id !== id);
      else return 'keep';
    },
    sttg() { const s = find(find(S.goals, el.dataset.g).steps, id); s.done = !s.done; },
    stdel() { const gl = find(S.goals, el.dataset.g); gl.steps = gl.steps.filter(s => s.id !== id); },
    gdone() { const gl = find(S.goals, id); gl.done = !gl.done; },
    gdel() {
      if (!confirm('Apagar essa meta? O dinheiro que você guardou continua no guardado do banco.')) return 'keep';
      S.goals = S.goals.filter(x => x.id !== id);
      for (const t of S.tx) if (t.goal === id) delete t.goal;
    },
    bset() {
      const b = find(S.banks, id), x = balance(id), fmt = c => (c / 100).toFixed(2).replace('.', ',');
      const c = prompt(`Quanto tem EM CONTA hoje no ${b.name}?`, fmt(x.conta));
      if (c === null) return 'keep';
      const g2 = prompt(`E quanto tem GUARDADO no ${b.name}?`, fmt(x.guard));
      if (g2 === null) return 'keep';
      const nc = parseMoney(c), ng = parseMoney(g2);
      if (isNaN(nc) || isNaN(ng)) { alert('Valor inválido'); return 'keep'; }
      b.initConta = (b.initConta || 0) + nc - x.conta;
      b.initGuard = (b.initGuard || 0) + ng - x.guard;
      toast('Saldo do ' + b.name + ' ajustado');
    },
    bdel() {
      if (id === S.cfg.main) { alert('Esse é o banco principal. Escolha outro principal em Configurações antes.'); return 'keep'; }
      if (S.tx.some(t => t.bank === id || t.from === id || t.to === id)) { alert('Esse banco tem lançamentos. Apague os lançamentos dele antes.'); return 'keep'; }
      if ((S.cfg.split || []).some(r => r.bank === id) || S.cfg.tiers.bank === id) { alert('Esse banco está na divisão do dinheiro ou no "guardar primeiro". Tire ele de lá antes.'); return 'keep'; }
      if (!confirm('Apagar esse banco?')) return 'keep';
      S.banks = S.banks.filter(b => b.id !== id);
      for (const b of S.bills) if (b.bank === id) delete b.bank;
    },
    accent() { S.cfg.accent = v; },
    theme() { S.cfg.theme = v; },
    themetg() { S.cfg.theme = S.cfg.theme === 'light' ? 'dark' : 'light'; },
    tabtg() { const h = S.cfg.hiddenTabs; S.cfg.hiddenTabs = h.includes(v) ? h.filter(x => x !== v) : [...h, v]; },
    banktg() {
      if (v === S.cfg.main) { alert('O banco principal não pode ser escondido.'); return 'keep'; }
      const h = S.cfg.hiddenBanks; S.cfg.hiddenBanks = h.includes(v) ? h.filter(x => x !== v) : [...h, v];
    },
    catren() {
      const t = el.dataset.t, list = t === 'out' ? S.cfg.catsOut : S.cfg.catsIn;
      const n = (prompt('Novo nome da categoria', v) || '').trim();
      if (!n || n === v) return 'keep';
      if (list.includes(n)) { alert('Essa categoria já existe.'); return 'keep'; }
      list[list.indexOf(v)] = n;
      for (const x of S.tx) if (x.cat === v && x.type === t) x.cat = n;
    },
    catdel() {
      e.stopPropagation();
      const t = el.dataset.t, key = t === 'out' ? 'catsOut' : 'catsIn';
      if (!confirm(`Remover a categoria "${v}"? Os lançamentos antigos continuam com ela.`)) return 'keep';
      S.cfg[key] = S.cfg[key].filter(c => c !== v);
    },
    pinset() { if (!askNewPin()) return 'keep'; unlocked = true; toast('Senha criada'); },
    pinchange() { if (!checkPin() || !askNewPin()) return 'keep'; toast('Senha trocada'); },
    pinoff() { if (!checkPin()) return 'keep'; delete S.cfg.pin; delete S.cfg.pinLen; toast('Senha removida'); },
    lock() { lock(); return 'keep'; },
    wipe() {
      if (!confirm('Tem certeza? Isso apaga TUDO deste aparelho.')) return 'keep';
      if ((prompt('Pra confirmar, escreva APAGAR') || '').trim().toUpperCase() !== 'APAGAR') return 'keep';
      (devCfg().on ? stopNotif() : Promise.resolve()).then(() => { localStorage.removeItem(KEY); localStorage.removeItem(DEV_KEY); sessionStorage.clear(); location.reload(); });
      return 'keep';
    },
    export() {
      S.cfg.lastBackup = today(); save();
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `backup-vida-${today()}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    share() {
      // .txt porque o Android não deixa compartilhar .json; o "Carregar backup" aceita os dois
      const file = new File([JSON.stringify(S, null, 2)], `backup-vida-${today()}.txt`, { type: 'text/plain' });
      if (!navigator.canShare || !navigator.canShare({ files: [file] })) { toast('Este aparelho não compartilha arquivo. Salvei o backup.'); return A.export(); }
      navigator.share({ files: [file], title: 'Backup Vida' })
        .then(() => { S.cfg.lastBackup = today(); save(); render(); toast('Backup compartilhado'); })
        .catch(e => { if (e.name !== 'AbortError') alert('Não consegui compartilhar. Use Salvar backup.'); });
      return 'keep';
    },
    import() { $('#importfile').click(); return 'keep'; },
  };
  if (!A[act]) return;
  if (A[act]() === 'keep') return;
  save(); render();
});

document.addEventListener('input', e => {
  // Campos de valor tipo maquininha: os números entram pela direita, os dois últimos são centavos (1700 → 17,00)
  if (e.target.matches('input[inputmode="decimal"]')) {
    const el = e.target, dg = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 13);
    el.value = dg ? (+dg / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
    if (el.matches('[data-sp]')) $('#sp-prev').innerHTML = splitPrev(parseMoney(el.value));
    return;
  }
  if (e.target.dataset.act === 'hq') { U.h.q = e.target.value; $('#hist-res').innerHTML = histResults(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importfile' && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!Array.isArray(d.banks) || !Array.isArray(d.tx)) throw new Error();
      if (!confirm('Isso troca TODOS os dados deste aparelho pelos do backup. Continuar?')) return;
      S = Object.assign(blank(), d); fixData(); save(); unlocked = true; render(); toast('Backup carregado');
    }).catch(() => alert('Esse arquivo não é um backup válido.'));
    return;
  }
  if (el.matches('[data-freq]')) {
    el.form.querySelector('.rep-weekly').hidden = el.value !== 'weekly';
    el.form.querySelector('.rep-every').hidden = el.value !== 'every';
    return;
  }
  if (el.matches('[data-btype]')) {
    for (const k of ['fixa', 'parc', 'unica']) el.form.querySelector('.b-' + k).hidden = el.value !== k;
    return;
  }
  if (el.matches('[data-bmode]')) {
    const dif = el.value === 'dif';
    el.form.querySelector('.b-igual').hidden = dif; el.form.querySelector('.b-dif').hidden = !dif;
    if (dif) billParcVals(el.form);
    return;
  }
  if (el.matches('[data-bn]')) { if (el.form.querySelector('[data-bmode]').value === 'dif') billParcVals(el.form); return; }
  if (el.matches('[data-parc]')) { el.form.querySelector('.parc-x').hidden = !(+el.value > 1); return; }
  if (el.matches('[data-rep]')) {
    const show = { every: el.value === 'every', weekly: el.value === 'weekly', until: el.value !== 'none' };
    for (const k in show) el.form.querySelector('.rep-' + k).hidden = !show[k];
    return;
  }
  if (el.dataset.act === 'tiercfg') { S.cfg.tiers[el.name] = el.value; save(); render(); return; }
  if (el.dataset.act === 'hbank') { U.h.bank = el.value; render(); }
  if (el.dataset.act === 'hdate' && el.value) { U.h[el.dataset.f] = el.value; render(); }
});

// ---------- Formulários ----------
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (!unlocked) return;
  const d = Object.fromEntries(new FormData(f));
  const F = {
    tx() {
      const kind = f.dataset.kind, st = U.l[kind], c = parseMoney(d.v);
      if (!(c > 0)) return toast('Escreva o valor');
      if (!st.bank) return toast('Escolha o banco');
      const parc = parseInt(d.parc || '1', 10);
      if (kind === 'out' && parc > 1) {
        if (!d.first) return toast('Escolha quando vence a primeira parcela');
        const group = uid(), each = Math.floor(c / parc), name = d.desc.trim() || st.cat || 'Compra';
        for (let i = 0; i < parc; i++) S.bills.push({ id: uid(), kind: 'var', name: `${name} (${i + 1}/${parc})`, cents: each + (i === 0 ? c - each * parc : 0),
          date: addMonths(d.first, i), paid: false, group, bank: st.bank, cat: st.cat || '' });
        st.cat = null;
        return toast(`Compra em ${parc}x de ${brlRaw(each)} foi pras Contas a pagar`);
      }
      S.tx.push({ id: uid(), type: kind, cents: c, bank: st.bank, cat: st.cat || '', desc: d.desc.trim(), date: d.date || today() });
      st.cat = null;
      toast((kind === 'out' ? 'Gasto de ' : 'Ganho de ') + brlRaw(c) + ' registrado');
    },
    sv() {
      const st = U.l.sv, c = parseMoney(d.v), dir = st.dir || 'save';
      if (!(c > 0)) return toast('Escreva o valor');
      if (!st.bank) return toast('Escolha o banco');
      const tx = { id: uid(), type: dir, cents: c, bank: st.bank, desc: '', date: d.date || today() };
      if (st.goal && find(S.goals, st.goal)) tx.goal = st.goal;
      S.tx.push(tx);
      toast((dir === 'save' ? 'Guardado ' : 'Tirado do guardado ') + brlRaw(c));
    },
    gsave() {
      const g = find(S.goals, f.dataset.g), st = U.l['g_' + g.id], c = parseMoney(d.v), dir = st.dir || 'save';
      if (!(c > 0)) return toast('Escreva o valor');
      if (!st.bank) return toast('Escolha o banco');
      S.tx.push({ id: uid(), type: dir, cents: c, bank: st.bank, goal: g.id, desc: '', date: today() });
      toast((dir === 'save' ? 'Guardado pra ' : 'Tirado de ') + g.title + ': ' + brlRaw(c));
    },
    gdate() {
      if (!d.deadline || d.deadline < today()) return toast('Escolha uma data a partir de hoje');
      const g = find(S.goals, f.dataset.g); g.deadline = d.deadline; g.start = today(); // o sistema começa hoje, com o que já tem guardado
    },
    tr() {
      const c = parseMoney(d.v);
      if (!(c > 0)) return toast('Escreva o valor');
      if (d.from === d.to) return toast('Escolha bancos diferentes');
      S.tx.push({ id: uid(), type: 'tr', cents: c, from: d.from, to: d.to, desc: '', date: today() });
      toast('Movido ' + brlRaw(c));
    },
    bill() {
      const name = d.name.trim();
      if (!name) return toast('Escreva o nome da conta');
      if (d.tipo === 'fixa') {
        const c = parseMoney(d.vf), day = parseInt(d.day, 10);
        if (!(c > 0)) return toast('Escreva o valor');
        if (!(day >= 1 && day <= 31)) return toast('Escreva o dia do vencimento (1 a 31)');
        S.bills.push({ id: uid(), kind: 'fixa', name, cents: c, day, start: d.start || today().slice(0, 7), paid: {} });
      } else if (d.tipo === 'parc') {
        const n = parseInt(d.n, 10);
        const vals = d.modo === 'dif' ? [...Array(n)].map((_, i) => parseMoney(d['p' + (i + 1)])) : Array(n).fill(parseMoney(d.vp));
        const bad = vals.findIndex(c => !(c > 0));
        if (bad >= 0) return toast(d.modo === 'dif' ? `Escreva o valor da parcela ${bad + 1}` : 'Escreva o valor de cada parcela');
        if (!d.first) return toast('Escolha quando vence a primeira parcela');
        const group = uid();
        vals.forEach((c, i) => S.bills.push({ id: uid(), kind: 'var', name: `${name} (${i + 1}/${n})`, cents: c, date: addMonths(d.first, i), paid: false, group }));
        return toast(`${n} parcelas adicionadas, total ${brlRaw(vals.reduce((s, c) => s + c, 0))}`);
      } else {
        const c = parseMoney(d.vu);
        if (!(c > 0)) return toast('Escreva o valor');
        if (!d.date) return toast('Escolha a data');
        S.bills.push({ id: uid(), kind: 'var', name, cents: c, date: d.date, paid: false });
      }
      toast('Conta adicionada');
    },
    split() {
      const pct = parseInt(d.pct, 10);
      if (!(pct >= 1 && pct <= 100)) return toast('Escreva a % (1 a 100)');
      if (splitSum() + pct > 100) return toast(`Só cabem mais ${100 - splitSum()}%`);
      const [dest, goal] = d.dest.split(':');
      (S.cfg.split || (S.cfg.split = [])).push({ id: uid(), pct, bank: d.bank, dest, goal: goal || '', for: d.for.trim() });
      toast('Parte adicionada');
    },
    sp() {
      const c = parseMoney(d.v), st = U.l.sp || {};
      if (!(c > 0)) return toast('Escreva o valor');
      if (!(S.cfg.split || []).length || splitSum() !== 100) return toast('A divisão precisa somar 100%');
      const date = d.date || today(), base = d.desc.trim() || st.cat || 'Espalhado', grp = uid();
      const p = spPct(c), g = Math.round(c * p / 100), tc = S.cfg.tiers, tb = tc.bank || S.cfg.main;
      if (g > 0) {
        S.tx.push({ id: uid(), type: 'in', cents: g, bank: tb, cat: st.cat || '', desc: base + ' · guardar ' + p + '%', date, sp: grp });
        const tx = { id: uid(), type: 'save', cents: g, bank: tb, desc: '', date, sp: grp };
        if (find(S.goals, tc.goal)) tx.goal = tc.goal;
        S.tx.push(tx);
      }
      for (const { r, v } of splitParts(c - g)) {
        if (!(v > 0)) continue;
        S.tx.push({ id: uid(), type: 'in', cents: v, bank: r.bank, cat: st.cat || '', desc: base + (r.for ? ' · ' + r.for : ''), date, sp: grp });
        if (r.dest !== 'conta') {
          const tx = { id: uid(), type: 'save', cents: v, bank: r.bank, desc: '', date, sp: grp };
          if (r.dest === 'goal' && find(S.goals, r.goal)) tx.goal = r.goal;
          S.tx.push(tx);
        }
      }
      st.cat = null; st.pct = null;
      toast(brlRaw(c) + ' espalhado' + (g > 0 ? ` · guardou ${brlRaw(g)} (${p}%)` : ''));
    },
    debt() {
      const c = parseMoney(d.v);
      if (!d.name.trim()) return toast('Escreva o que é a dívida');
      if (!(c > 0)) return toast('Escreva o valor total');
      S.debts.push({ id: uid(), name: d.name.trim(), to: d.to.trim(), cents: c, start: today(), pays: [] });
      toast('Dívida adicionada');
    },
    nhours() { setDev({ hContas: d.hContas || '09:00', hMetas: d.hMetas || '20:00' }); scheduleSync(500); toast('Horários salvos'); },
    habit() {
      const fd = new FormData(f), title = d.title.trim();
      if (!title) return toast('Escreva o nome do sistema');
      const freq = { type: d.freq };
      if (d.freq === 'weekly') { freq.days = fd.getAll('wd').map(Number); if (!freq.days.length) return toast('Escolha os dias da semana'); }
      if (d.freq === 'every') { freq.n = parseInt(d.n, 10); if (!(freq.n >= 2)) return toast('Escreva de quantos em quantos dias (2 ou mais)'); }
      if (d.until && d.until < (d.start || today())) return toast('A data final precisa ser depois do começo');
      const items = d.items.split('\n').map(s => s.trim()).filter(Boolean).map(t => ({ id: uid(), t, days: [] }));
      S.habits.push({ id: uid(), title, area: d.area || 'Outros', freq, time: d.time || '', timeEnd: d.timeEnd || '', start: d.start || today(), until: d.until || '', items, log: {} });
      toast('Sistema criado');
    },
    habitem() {
      if (!d.t.trim()) return;
      find(S.habits, f.dataset.h).items.push({ id: uid(), t: d.t.trim(), days: new FormData(f).getAll('wd').map(Number) });
    },
    txedit() {
      const t = find(S.tx, f.dataset.id), c = parseMoney(d.v);
      if (!(c > 0)) return toast('Escreva o valor');
      if (t.type === 'tr' && d.from === d.to) return toast('Escolha bancos diferentes');
      t.cents = c; t.date = d.date || t.date;
      if ('bank' in d) t.bank = d.bank;
      if ('cat' in d) t.cat = d.cat;
      if ('desc' in d) t.desc = d.desc.trim();
      if ('from' in d) { t.from = d.from; t.to = d.to; }
      if ('goal' in d) { if (d.goal) t.goal = d.goal; else delete t.goal; }
      closeSheet(); toast('Lançamento atualizado');
    },
    dem() {
      if (!d.t.trim()) return toast('Escreva a demanda');
      const kind = d.nk.trim() || d.kind || 'Trabalho';
      if (d.nk.trim() && !S.cfg.workKinds.includes(kind)) S.cfg.workKinds.push(kind);
      S.tasks.push({ id: uid(), t: d.t.trim(), area: 'Trabalho', kind, date: d.date || '', time: d.time || '', done: false, doneAt: '' });
      toast('Agendado' + (d.date ? ' pra ' + fmtShort(d.date) : ''));
      setTimeout(() => $('[data-form=dem] input').focus());
    },
    book() { if (!d.title.trim()) return toast('Escreva o livro'); S.know.books.push({ id: uid(), title: d.title.trim(), author: d.author.trim(), status: 'quero', page: 0, pages: 0, finished: '' }); },
    bookpg() { const x = find(S.know.books, f.dataset.id); x.page = +d.page || 0; x.pages = +d.pages || 0; if (x.pages && x.page >= x.pages) { x.status = 'li'; x.finished = today(); toast('Terminou o livro 📚'); } },
    quote() { if (!d.t.trim()) return toast('Escreva a frase'); S.know.quotes.push({ id: uid(), t: d.t.trim(), author: d.author.trim() }); toast('Frase guardada'); },
    frame() { if (!d.t.trim()) return toast('Escreva o quadro'); S.know.frames.push({ id: uid(), t: d.t.trim(), author: d.author.trim(), done: false }); },
    course() { if (!d.title.trim()) return toast('Escreva o curso'); S.know.courses.push({ id: uid(), title: d.title.trim(), lessons: [] }); },
    lesson() {
      const c = find(S.know.courses, f.dataset.id), ls = d.t.split('\n').map(s => s.trim()).filter(Boolean);
      if (!ls.length) return toast('Escreva a aula');
      for (const t of ls) c.lessons.push({ id: uid(), t, done: false, doneAt: '' });
      setTimeout(() => $(`[data-form=lesson][data-id="${c.id}"] input`).focus());
    },
    tier() {
      const from = parseMoney(d.from), pct = parseInt(d.pct, 10);
      if (!(from >= 0) || !(pct >= 0 && pct <= 100)) return toast('Escreva o valor e a %');
      S.cfg.tiers.list = S.cfg.tiers.list.filter(x => x.from !== from).concat({ id: uid(), from, pct });
    },
    task() {
      if (!d.t.trim()) return toast('Escreva a pendência');
      S.tasks.push({ id: uid(), t: d.t.trim(), area: d.area || 'Trabalho', date: d.date || '', done: false, doneAt: '' });
      setTimeout(() => $('[data-form=task] input').focus());
    },
    sal() {
      const c = parseMoney(d.v);
      if (!(c > 0)) return toast('Escreva o valor');
      if (!d.date) return toast('Escolha a data');
      S.sal.push({ id: uid(), src: d.src, cents: c, date: d.date, sure: d.sure === '1' });
      toast('Previsto ' + brlRaw(c));
    },
    salmin() { const c = parseMoney(d.v); if (!(c > 0)) return toast('Escreva o valor'); S.cfg.salMin = c; toast('Mínimo: ' + brlRaw(c)); },
    shop() { if (!d.name.trim()) return; S.shop.push({ id: uid(), name: d.name.trim(), done: false }); setTimeout(() => $('[data-form=shop] input').focus()); },
    ev() {
      if (!d.title.trim()) return toast('Escreva o que fazer');
      const rep = { type: d.rep || 'none', until: d.until || '' };
      if (rep.type === 'every') { rep.n = parseInt(d.n, 10); if (!(rep.n >= 2)) return toast('Escreva de quantos em quantos dias (2 ou mais)'); }
      if (rep.type === 'weekly') { rep.days = new FormData(f).getAll('wd').map(Number); if (!rep.days.length) return toast('Escolha pelo menos um dia da semana'); }
      S.events.push({ id: uid(), title: d.title.trim(), date: U.ag.sel, time: d.time || '', notes: d.notes.trim(), color: U.l.ev.color || 'purple', rep, done: false });
      toast(rep.type === 'none' ? 'Compromisso adicionado' : 'Compromisso repetido adicionado');
    },
    goal() {
      const c = parseMoney(d.v), ini = parseMoney(d.initial);
      if (!d.title.trim()) return toast('Escreva a meta');
      if (!(c > 0)) return toast('Escreva quanto custa');
      if (d.deadline && d.deadline < today()) return toast('A data precisa ser a partir de hoje');
      S.goals.push({ id: uid(), kind: 'money', title: d.title.trim(), cents: c, initial: ini > 0 ? ini : 0, start: today(), deadline: d.deadline || '', done: false });
      toast('Meta criada');
    },
    bank() {
      if (!d.name.trim()) return toast('Escreva o nome do banco');
      const c = parseMoney(d.conta), g = parseMoney(d.guard);
      S.banks.push({ id: uid(), name: d.name.trim(), logo: null, initConta: isNaN(c) ? 0 : c, initGuard: isNaN(g) ? 0 : g });
      toast('Banco adicionado');
    },
    cfg() {
      S.cfg.name = d.name.trim() || 'Fillipe';
      if (d.main && d.main !== S.cfg.main) {
        S.cfg.main = d.main;
        S.cfg.hiddenBanks = S.cfg.hiddenBanks.filter(x => x !== d.main);
        for (const k of ['out', 'in', 'sv']) U.l[k].bank = d.main;
      }
      const lim = parseMoney(d.limit);
      S.cfg.limit = lim > 0 ? lim : 0;
      toast('Configurações salvas');
    },
    cat() {
      const n = d.name.trim(), key = f.dataset.t === 'out' ? 'catsOut' : 'catsIn';
      if (!n) return;
      if (S.cfg[key].includes(n)) return toast('Essa categoria já existe');
      S.cfg[key].push(n);
    },
    colors() {
      for (const k of Object.keys(COLORS)) S.cfg.colorNames[k] = (d[k] || '').trim();
      toast('Nomes salvos');
    },
  };
  const before = JSON.stringify(S);
  F[f.dataset.form]();
  if (JSON.stringify(S) !== before) { save(); render(); }
});

// ---------- Início ----------
try { const v = sessionStorage.getItem('vida-view'); if (v && VIEWS[v]) U.view = v; } catch (e) {}
// abriu por uma notificação: vai direto pra aba do aviso
const goParam = new URLSearchParams(location.search).get('go');
if (goParam && VIEWS[goParam]) { U.view = goParam; history.replaceState(null, '', location.pathname); }
render();
scheduleSync(1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(1000); });
if (S.cfg.pin) lock();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
