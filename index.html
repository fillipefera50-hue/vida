<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vida</title>
<link rel="manifest" href="manifest-purple.json">
<link rel="icon" href="icons/purple-192.png">
<link rel="apple-touch-icon" href="icons/purple-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #000000; --card: #0e0e10; --card-2: #17171a; --line: #1f1f23; --line-2: #2a2a2f;
  --fg: #f4f4f5; --muted: #a1a1a8; --accent: #9d5cff; --accent-2: #b98aff;
  --green: #1ee07f; --red: #ff5c7a; --blue: #4d8dff; --amber: #ffc21a;
  --r: 18px; --head: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; --body: Inter, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { max-width: 480px; margin: 0 auto; padding: 24px 20px calc(110px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top .sub { font-size: 13px; color: var(--muted); }
.top h1 { margin: 2px 0 0; font-family: var(--head); font-size: 24px; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: 13px; color: var(--muted); border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.label { font-size: 13px; color: var(--muted); }
.big { font-family: var(--head); font-size: 56px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
.mid { font-family: var(--head); font-size: 22px; font-weight: 700; }
.hero { display: flex; flex-direction: column; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.tight { padding: 4px 16px; gap: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row.base { align-items: baseline; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item .t span:first-child { font-size: 15px; overflow-wrap: anywhere; }
.item small, .note { font-size: 12px; color: var(--muted); }
.val { font-size: 15px; font-weight: 600; white-space: nowrap; }
.pos { color: var(--green); } .neg { color: var(--red); } .save { color: var(--blue); } .acc { color: var(--accent); } .dim { color: var(--muted); }
.track { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; }
.track.thick { height: 10px; border-radius: 5px; }
.fill { height: 100%; background: var(--accent); border-radius: inherit; }
.bars { height: 140px; display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.bar div { width: 100%; max-width: 34px; border-radius: 8px; background: var(--line-2); min-height: 4px; }
.bar div.on { background: var(--red); }
.bar span { font-size: 11px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 28px 12px; line-height: 1.5; }
.seg { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 10px 0; font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #000; font-weight: 600; }
.pager { display: flex; align-items: center; justify-content: space-between; }
.pager button { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; font-size: 18px; }
.pager button:disabled { opacity: .3; }
.days { display: flex; justify-content: space-between; }
.day { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.day i { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); display: block; }
.day i.on { background: var(--accent); border-color: var(--accent); }
.day.today span { color: var(--fg); font-weight: 600; }
/* formulários */
.in { width: 100%; min-height: 46px; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea.in { min-height: 80px; resize: vertical; }
.btn { min-height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: #000; font-weight: 600; font-size: 15px; padding: 0 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-2); }
.btn.small { min-height: 38px; font-size: 13px; padding: 0 12px; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid #4a1f29; }
.form { display: flex; flex-direction: column; gap: 10px; }
.inline { display: flex; gap: 8px; } .inline .in { flex: 1; min-width: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 9px 13px; font-size: 13px; color: var(--muted); cursor: pointer; }
.pill.on { border-color: var(--accent); color: var(--fg); background: rgba(157, 92, 255, .16); }
/* conhecimento */
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 0 0 10px; border-bottom: 2px solid transparent; cursor: pointer; }
.tabs button.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
.covers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cover { display: flex; flex-direction: column; gap: 8px; text-align: left; border: 0; background: transparent; padding: 0; cursor: pointer; }
.cover .img { height: 150px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line-2); padding: 12px; display: flex; align-items: flex-end; overflow: hidden; position: relative; }
.cover .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover .img b { font-family: var(--head); font-size: 15px; line-height: 1.15; position: relative; }
.cover .img .rate { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.7); border-radius: 999px; padding: 3px 8px; font-size: 12px; color: var(--amber); }
.cover small { font-size: 12px; color: var(--muted); }
.cover .prog { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; } .cover .prog div { height: 100%; background: var(--blue); }
.stars { display: flex; gap: 4px; flex-wrap: wrap; }
.stars button { width: 30px; height: 34px; border: 0; background: transparent; color: var(--line-2); font-size: 20px; cursor: pointer; padding: 0; }
.stars button.on { color: var(--amber); }
.stars button.zero { font-size: 13px; width: 34px; border: 1px solid var(--line-2); border-radius: 8px; color: var(--muted); }
.stars button.zero.on { border-color: var(--amber); color: var(--amber); }
.check { width: 28px; height: 28px; flex: none; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; display: grid; place-items: center; color: #000; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check svg { width: 16px; height: 16px; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 15px; overflow-wrap: anywhere; }
.li .t.done { color: var(--muted); text-decoration: line-through; }
.x { width: 36px; height: 36px; flex: none; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 10px; }
.thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
.quote { font-family: var(--head); font-size: 20px; line-height: 1.35; margin: 0; }
.file { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
/* menu de baixo e folha */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: center; z-index: 5; }
nav.bottom div { width: 100%; max-width: 480px; display: flex; justify-content: space-around; }
nav.bottom button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 8px 10px; min-width: 88px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: #0b0b0d; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font-family: var(--head); font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: #000; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; z-index: 20; pointer-events: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: block; }
.status i.bad { background: var(--red); } .status i.off { background: var(--muted); }
/* senha pra entrar */
#lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; }
#lock[hidden] { display: none; }
#lock h2 { margin: 0; font-family: var(--head); font-size: 22px; }
#dots { display: flex; gap: 14px; height: 16px; }
#dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); display: block; }
#dots i.on { background: var(--accent); border-color: var(--accent); }
#dots.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 16px; }
.keys button { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); font-family: var(--head); font-size: 26px; cursor: pointer; }
.keys button:active { background: var(--accent); color: #000; }
.keys .blank { visibility: hidden; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottom" id="nav"></nav>
<div id="sheet"></div>
<div id="lock" hidden><h2>Vida</h2><span class="label">Digite sua senha</span><div id="dots"></div>
  <div class="keys"><button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button><button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button><button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button><span class="blank"></span><button data-pin="0">0</button><button data-pin="del" aria-label="Apagar">⌫</button></div></div>
<script>
'use strict';
// App Vida (v21): só pra olhar. Dinheiro, metas e recap vêm do Claude (feed cifrado no vida-push, chave própria).
// Conhecimento é o único lugar onde o Fillipe lança; usa os mesmos dados ('vida-app') e a mesma sincronização do app antigo.

// ---------- Básico ----------
const PUSH_SERVER = 'https://vida-push.vida-push.workers.dev';
const SYNC_SERVER = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://127.0.0.1:8787' : PUSH_SERVER;
const KEY = 'vida-app', FEED_KEY = 'vida-feed', FEED_DATA = 'vida-feed-data', UI_KEY = 'vida-ui', DEV_KEY = 'vida-dev';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const find = (l, id) => l.find(x => x.id === id);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = toDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const ymAdd = (ym, n) => { const d = toDate(ym + '-01'); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const MES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const mesNome = ym => MES[+ym.slice(5, 7) - 1];
const mesAno = ym => mesNome(ym)[0].toUpperCase() + mesNome(ym).slice(1) + ' · ' + ym.slice(0, 4);
const dm = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
const IC = {
  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  recap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ---------- Dados do aparelho (os mesmos do app antigo; este app só mexe em S.know) ----------
const blank = () => ({ banks: [], tx: [], bills: [], debts: [], shop: [], events: [], goals: [], habits: [], tasks: [], days: {} });
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { S = blank(); }
function fixData() {
  if (!S.know || typeof S.know !== 'object') S.know = {};
  for (const k of ['books', 'quotes', 'frames', 'courses', 'niches']) if (!Array.isArray(S.know[k])) S.know[k] = [];
  for (const n of S.know.niches) if (!Array.isArray(n.items)) n.items = [];
  for (const c of S.know.courses) if (!Array.isArray(c.lessons)) c.lessons = [];
}
fixData();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { alert('Não consegui salvar no aparelho.'); }
  try { syncTrack(); } catch (e) {}
}
let U = { tab: 'dinheiro', din: 'painel', know: 'livros', st: {}, recap: 'semana', wk: 0, mo: 0, hist: '' };
try { Object.assign(U, JSON.parse(localStorage.getItem(UI_KEY)) || {}); } catch (e) {}
U.sheet = null;
const saveUI = () => { try { const { sheet, ...u } = U; localStorage.setItem(UI_KEY, JSON.stringify(u)); } catch (e) {} };

// ---------- Cifra (igual à sincronização do app antigo) ----------
const te = new TextEncoder();
async function sha256hex(s) { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode(s)))].map(x => x.toString(16).padStart(2, '0')).join(''); }
const bytesToB64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64ToBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function gz(bytes, open) {
  const cs = open ? new DecompressionStream('gzip') : new CompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer());
}
async function syncDerive(code, pass) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: te.encode('vida-sync:salt:' + code), iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(key, obj) {
  let data = te.encode(JSON.stringify(obj)), tag = 'p1';
  if (typeof CompressionStream === 'function') { data = await gz(data); tag = 'g1'; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return tag + '.' + bytesToB64(out);
}
async function unseal(key, blob) {
  const [tag, b] = blob.split('.'), u = b64ToBytes(b);
  let data = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)));
  if (tag === 'g1') data = await gz(data, true);
  return JSON.parse(new TextDecoder().decode(data));
}
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function normCode(s) {
  const c = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return c.length === 20 && [...c].every(x => CODE_ABC.includes(x)) ? c.match(/.{4}/g).join('-') : '';
}
async function syncIds(code) { return { k: await sha256hex('vida-sync:id:' + code), auth: await sha256hex('vida-sync:auth:' + code) }; }
async function api(server, path, body) {
  const r = await fetch(server + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { status: r.status, ...(await r.json().catch(() => ({}))) };
}

// ---------- Feed do Claude (só leitura) ----------
function feedCfg() { try { return JSON.parse(localStorage.getItem(FEED_KEY)) || null; } catch (e) { return null; } }
function setFeed(c) { try { localStorage.setItem(FEED_KEY, JSON.stringify(c)); } catch (e) {} }
let F = null;
try { F = JSON.parse(localStorage.getItem(FEED_DATA)); } catch (e) {}
let feedBusy = false;
// link "#feed=CODIGO.SENHA" (o Claude manda uma vez): guarda e tira do endereço
function feedFromHash() {
  const m = location.hash.match(/^#feed=([A-Za-z0-9]+)\.([A-Za-z0-9]+)$/);

// ---------- Sincronização do Conhecimento (mesma do app antigo: mesma chave, mesmo formato) ----------
var SYNC_KEY = 'vida-sync', SYNC_META = 'vida-sync-meta';
var SYNC_LISTS = ['banks', 'tx', 'bills', 'debts', 'shop', 'events', 'goals', 'habits', 'tasks', 'sal'];
var SYNC_KNOW = ['books', 'quotes', 'frames', 'courses', 'niches'];

function syncCfg() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }

function syncMetaSet(x) { try { localStorage.setItem(SYNC_META, JSON.stringify(x)); } catch (e) {} }

  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (b >>> 0).toString(36) + (a >>> 0).toString(36);
}
function syncUnits(s) {
  const u = new Map();
  const list = (p, arr) => { if (Array.isArray(arr)) for (const x of arr) if (x && typeof x === 'object') u.set(p + ':' + (x.id || '#' + hashStr(JSON.stringify(x))), x); };
  for (const k of SYNC_LISTS) list(k, s[k]);
  for (const k of SYNC_KNOW) list('know.' + k, s.know && s.know[k]);
  for (const [d, x] of Object.entries(s.days || {})) u.set('days:' + d, x);
  for (const k of Object.keys(s)) if (!SYNC_LISTS.includes(k) && k !== 'days' && k !== 'know') u.set('$' + k, s[k]);
  for (const k of Object.keys(s.know || {})) if (!SYNC_KNOW.includes(k)) u.set('$know.' + k, s.know[k]);

}
function syncBuild(win, ...orders) {

  for (const k of SYNC_LISTS) s[k] = [];

    if (seen.has(p) || !win.has(p)) return;
    seen.add(p);
    const x = win.get(p), i = p.indexOf(':');
    if (p[0] === '$') { const k = p.slice(1); if (k.startsWith('know.')) s.know[k.slice(5)] = x; else s[k] = x; return; }
    const g = p.slice(0, i);
    if (g === 'days') s.days[p.slice(i + 1)] = x;
    else if (g.startsWith('know.')) s.know[g.slice(5)].push(x);
    else s[g].push(x);

}
function syncMerge(L, Lm, R, Rm) {
  const win = new Map(), m = {};

  for (const p of new Set([...L.keys(), ...R.keys(), ...Object.keys(Lm), ...Object.keys(Rm)])) {
    const a = Lm[p] || { u: 0 }, b = Rm[p] || { u: 0 };
    const va = L.has(p) ? JSON.stringify(L.get(p)) : '', vb = R.has(p) ? JSON.stringify(R.get(p)) : '';
    const local = a.u !== b.u ? a.u > b.u : va >= vb;
    const v = local ? va : vb, x = local ? a : b;
    if (v) win.set(p, local ? L.get(p) : R.get(p));

}

  for (const [p, x] of syncUnits(S)) h[p] = hashStr(JSON.stringify(x));
  syncMetaSet({ h, m });
}
function syncTrack() {
  if (!syncCfg().on) return;
  const meta = syncMetaGet(), now = Date.now(), h = {};
  let changed = false;
  for (const [p, x] of syncUnits(S)) { h[p] = hashStr(JSON.stringify(x)); if (meta.h[p] !== h[p]) { meta.m[p] = { u: now }; changed = true; } }
  for (const p of Object.keys(meta.h)) if (!(p in h)) { meta.m[p] = { u: now, d: 1 }; changed = true; }

function syncSetLocal(s, m) {
  S = Object.assign(blank(), s); fixData();

  syncBaseline(m);
}
function idb(fn) {
  return new Promise((ok, no) => {
    const r = indexedDB.open('vida', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onerror = () => no(r.error);
    r.onsuccess = () => {
      const db = r.result, t = db.transaction('kv', 'readwrite'), q = fn(t.objectStore('kv'));
      t.oncomplete = () => { db.close(); ok(q && q.result); };
      t.onerror = () => { db.close(); no(t.error); };

async function syncBackup(why) {

  list.unshift({ at: Date.now(), why, data });

async function syncKey() { if (!syncKeyMem) try { syncKeyMem = await idbGet('synckey'); } catch (e) {} return syncKeyMem; }

async function syncRun() {
  const c = syncCfg();
  if (!c.on || syncBusy || !navigator.onLine) return;
  syncBusy = true;
  try {
    const key = await syncKey();
    if (!key) { setSync({ err: 'senha' }); return; }
    const ids = await syncIds(c.code), r = await api(SYNC_SERVER, '/state/get', ids);
    if (r.status !== 200) throw new Error(r.status === 403 ? 'chave' : 'servidor');
    if (r.v && r.v !== c.v) {
      const snap = JSON.stringify(S), rem = await unseal(key, r.blob);
      if (JSON.stringify(S) !== snap) { syncLater(3000); return; }
      const meta = syncMetaGet(), res = syncMerge(syncUnits(S), meta.m, syncUnits(rem.s), rem.m || {});
      if (res.pull) { await syncBackup('antes de sincronizar'); syncSetLocal(syncBuild(res.win, S, rem.s), res.m); render(); }
      else syncMetaSet({ h: meta.h, m: res.m });
      setSync({ v: r.v, dirty: syncCfg().dirty || res.push });
    }
    if (syncCfg().dirty) {
      const blob = await seal(key, { s: S, m: syncPrune(syncMetaGet().m), at: Date.now() });
      const p = await api(SYNC_SERVER, '/state/put', { ...ids, v: syncCfg().v || 0, blob, dev: devId() });
      if (p.status === 200) setSync({ v: p.v, dirty: false, at: Date.now(), err: '' });
      else if (p.status === 409) syncLater(2000);
      else if (p.status === 429) syncLater((p.wait || 15000) + 500);
      else throw new Error(p.status === 413 ? 'grande' : 'servidor');
    } else setSync({ at: Date.now(), err: '' });

    setSync({ err: e.message === 'chave' ? 'chave' : e.message === 'grande' ? 'grande' : 'rede' });
  } finally { syncBusy = false; if (U.sheet && U.sheet.t === 'ajustes') render(); }
}
// Ligar neste aparelho com a chave que já existe: sempre junta os dois lados (nada se perde)
async function syncJoin(code, pass) {
  const key = await syncDerive(code, pass), r = await api(SYNC_SERVER, '/state/get', await syncIds(code));
  if (r.status === 403) throw new Error('chave');
  if (r.status !== 200) throw new Error('rede');
  if (!r.v) throw new Error('naoachei');
  let rem;
  try { rem = await unseal(key, r.blob); } catch (e) { throw new Error('senha'); }
  await syncBackup('antes de ligar a sincronização');
  const res = syncMerge(syncUnits(S), {}, syncUnits(rem.s), rem.m || {});

function contasMes(ym) {

function shrinkImg(file, max = 240) {
  return new Promise((ok, bad) => {
    const r = new FileReader(); r.onerror = bad;

      const img = new Image(); img.onerror = bad;

}

// ---------- Senha pra entrar (mesma do app antigo: S.cfg.pin, 4 a 6 números) ----------
function hashPin(p) {
  let h = 2166136261 >>> 0;
  const s = 'vida-app:' + p;
  for (let r = 0; r < 800; r++) for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + r; h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16);
}
const cfg = () => (S.cfg && typeof S.cfg === 'object') ? S.cfg : (S.cfg = {});

function lock() { if (!cfg().pin) return; pinBuf = ''; $('#lock').hidden = false; drawDots(); }
function pinKey(k) {
  const n = cfg().pinLen || 4;
  if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < n) pinBuf += k;
  drawDots();
  if (pinBuf.length === n) {
    if (hashPin(pinBuf) === cfg().pin) { $('#lock').hidden = true; pinBuf = ''; }
    else { const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); setTimeout(() => { pinBuf = ''; drawDots(); }, 350); }
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) pinKey(b.dataset.pin); });

      <span class="note">Dinheiro, metas e recap. Quem escreve é o Claude; aqui é só pra ver.${F && F.at ? ' Última atualização do Claude: ' + quando2(F.at) + '.' : ''}</span>
      ${f ? `<button class="btn ghost small" data-act="feednow" style="align-self:flex-start">Buscar agora</button>` : `<form class="inline" data-form="feed"><input name="c" class="in" placeholder="Código que o Claude mandou" autocomplete="off" aria-label="Código"><button class="btn small">Ligar</button></form>`}</div>
    <div class="card"><div class="row"><span style="font-weight:600">Sincronizar Conhecimento</span><span class="status"><i class="${!s.on ? 'off' : s.err ? 'bad' : ''}"></i>${!s.on ? 'desligada' : sErr || 'ligada'}</span></div>
      <span class="note">Livros, abas, cursos, frases e quadros entre os aparelhos.${s.on ? ' Última: ' + quando2(s.at) + '.' : ''}</span>
      ${!s.on ? `<form class="form" data-form="syncjoin"><input name="code" class="in" placeholder="Sua chave (XXXX-XXXX-…)" autocomplete="off" aria-label="Chave"><input name="pass" class="in" type="password" placeholder="Senha" aria-label="Senha"><button class="btn small">Ligar neste aparelho</button></form>`
        : s.err === 'senha' ? `<form class="inline" data-form="syncpass"><input name="pass" class="in" type="password" placeholder="Senha" aria-label="Senha"><button class="btn small">Ok</button></form>`
        : `<button class="btn ghost small" data-act="syncnow" style="align-self:flex-start">Sincronizar agora</button>`}</div>
    <div class="card"><div class="row"><span style="font-weight:600">Senha pra entrar</span><span class="status"><i class="${cfg().pin ? '' : 'off'}"></i>${cfg().pin ? 'ligada' : 'desligada'}</span></div>
      <span class="note">De 4 a 6 números. Pede de novo quando você sai do app por mais de 1 minuto.</span>
      <form class="form" data-form="pin">
        ${cfg().pin ? '<input name="old" class="in" type="password" inputmode="numeric" maxlength="6" placeholder="Senha atual" aria-label="Senha atual">' : ''}
        <input name="a" class="in" type="password" inputmode="numeric" maxlength="6" placeholder="${cfg().pin ? 'Senha nova (vazio = tirar a senha)' : 'Senha nova'}" aria-label="Senha nova">
        <input name="b" class="in" type="password" inputmode="numeric" maxlength="6" placeholder="Repita a senha nova" aria-label="Repita a senha nova">
        <button class="btn small" style="align-self:flex-start">${cfg().pin ? 'Trocar ou tirar' : 'Criar senha'}</button></form></div>
    <span class="note">App Vida v24.</span>`;
}

// ---------- Montagem ----------
const TABS = [['dinheiro', 'Dinheiro', IC.money], ['conhecimento', 'Conhecimento', IC.book], ['recap', 'Recap', IC.recap]];
function render() {
  const ym = today().slice(0, 7);
  let sub, title, chips = '', body;
  if (U.tab === 'dinheiro') {
    const d = DIN.find(x => x[0] === U.din) || DIN[0];
    sub = mesAno(ym); title = d[0] === 'painel' ? 'Dinheiro' : d[1];
    chips = `<div class="chips">${DIN.map(([k, l]) => `<button class="chip ${k === d[0] ? 'on' : ''}" data-act="din" data-v="${k}">${l}</button>`).join('')}</div>`;
    body = !F ? noFeed() : { painel: vPainel, salario: vSalario, contas: vContas, metas: vMetas, historico: vHistorico }[d[0]]();
  } else if (U.tab === 'recap') {
    sub = 'Seu dinheiro em resumo'; title = 'Recap'; body = F ? vRecap() : noFeed();
  } else {
    const tabs = knowTabs(); if (!tabs.some(t => t[0] === U.know)) U.know = 'livros';
    sub = 'Você lança aqui'; title = 'Conhecimento';
    chips = `<div class="chips">${tabs.map(([k, l]) => `<button class="chip ${k === U.know ? 'on' : ''}" data-act="know" data-v="${esc(k)}">${esc(l)}</button>`).join('')}<button class="chip" data-act="newniche">+ Nova aba</button></div>`;
    body = U.know === 'livros' ? vColecao('b') : U.know.startsWith('n_') ? vColecao(U.know.slice(2)) : { cursos: vCursos, frases: vFrases, quadros: vQuadros }[U.know]();
  }
  $('#app').innerHTML = `<header class="top"><div><div class="sub">${esc(sub)}</div><h1>${esc(title)}</h1></div><button class="icon-btn" data-act="ajustes" aria-label="Ajustes">${IC.gear}</button></header>${chips}${body}`;
  $('#nav').innerHTML = `<div>${TABS.map(([k, l, ic]) => `<button class="${U.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}" aria-current="${U.tab === k ? 'page' : 'false'}">${ic}${l}</button>`).join('')}</div>`;
  const sh = U.sheet, html = !sh ? '' : sh.t === 'ajustes' ? sheetAjustes() : sh.t === 'item' ? sheetItem(sh.k, sh.id) : sh.t === 'niche' ? sheetNiche(sh.id) : '';
  if (sh && !html) U.sheet = null;
  $('#sheet').innerHTML = html ? `<div class="sheet-bg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>` : '';
  document.body.style.overflow = html ? 'hidden' : '';
  saveUI();
}

// ---------- Ações ----------
const ACT = {
  tab(v) { U.tab = v; U.sheet = null; scrollTo(0, 0); },
  din(v) { U.din = v; }, know(v) { U.know = v; }, hist(v) { U.hist = v; },
  recap(v) { U.recap = v; }, pg(v) { if (U.recap === 'semana') U.wk = Math.min(0, U.wk + +v); else U.mo = Math.min(0, U.mo + +v); },
  ajustes() { U.sheet = { t: 'ajustes' }; }, close() { U.sheet = null; }, bg() {},
  feednow() { feedLoad(true); toast('Buscando…'); },
  syncnow() { syncRun(); toast('Sincronizando…'); },
  stab(v, el) { U.st[el.dataset.k] = v; },
  open(v, el) { U.sheet = { t: 'item', k: el.dataset.k, id: el.dataset.id }; },
  newniche() { U.sheet = { t: 'niche' }; }, nicheedit(v, el) { U.sheet = { t: 'niche', id: el.dataset.id }; },
  kst(v, el) {
    const k = el.dataset.k, x = find(listOf(k), el.dataset.id), done = doneOf(k);
    x.status = v; x.finished = v === done ? (x.finished || today()) : '';
    U.st[k] = v; if (v === done) toast('Terminou! Dá a nota ★'); return true;
  },
  rate(v, el) { const x = find(listOf(el.dataset.k), el.dataset.id); if (x.rate === +v) delete x.rate; else x.rate = +v; return true; },
  imgdel(v, el) { delete find(listOf(el.dataset.k), el.dataset.id).img; return true; },
  del(v, el) {
    if (!confirm('Apagar esse item?')) return;
    const k = el.dataset.k, id = el.dataset.id;
    if (k === 'b') S.know.books = S.know.books.filter(x => x.id !== id); else { const n = nicheOf(k); n.items = n.items.filter(x => x.id !== id); }
    U.sheet = null; return true;
  },
  nichedel(v, el) {
    const n = nicheOf(el.dataset.id);
    if (!confirm(`Apagar a aba "${n.name}"${n.items.length ? ` e os ${n.items.length} itens dela` : ''}?`)) return;
    S.know.niches = S.know.niches.filter(x => x.id !== n.id); U.sheet = null; U.know = 'livros'; return true;
  },
  lesson(v, el) { const l = find(find(S.know.courses, el.dataset.id).lessons, el.dataset.i); l.done = !l.done; l.doneAt = l.done ? today() : ''; return true; },
  lessondel(v, el) { const c = find(S.know.courses, el.dataset.id); c.lessons = c.lessons.filter(l => l.id !== el.dataset.i); return true; },
  coursedel(v, el) { if (!confirm('Apagar o curso inteiro?')) return; S.know.courses = S.know.courses.filter(c => c.id !== el.dataset.id); return true; },
  quotedel(v, el) { S.know.quotes = S.know.quotes.filter(x => x.id !== el.dataset.id); return true; },
  frametg(v, el) { const x = find(S.know.frames, el.dataset.id); x.done = !x.done; return true; },
  framedel(v, el) { if (!confirm('Apagar esse quadro?')) return; S.know.frames = S.know.frames.filter(x => x.id !== el.dataset.id); return true; },
};
const FORM = {
  add(d, f) {
    const k = f.dataset.k, title = d.title.trim().slice(0, 120), sub = d.sub.trim().slice(0, 80);
    if (!title) return toast('Escreva o nome');
    if (k === 'b') S.know.books.push({ id: uid(), title, author: sub, status: 'quero', page: 0, pages: 0, finished: '' });
    else nicheOf(k).items.push({ id: uid(), title, sub, status: 'quero', note: '', finished: '' });
    U.st[k] = 'quero'; return true;
  },
  bookpg(d, f) { const x = find(S.know.books, f.dataset.id); x.page = +d.page || 0; x.pages = +d.pages || 0; if (x.pages && x.page >= x.pages) { x.status = 'li'; x.finished = today(); toast('Terminou o livro'); } else toast('Página salva'); return true; },
  note(d, f) { find(listOf(f.dataset.k), f.dataset.id).note = d.t.trim().slice(0, 3000); toast('Comentário salvo'); return true; },
  course(d) { if (!d.title.trim()) return toast('Escreva o curso'); S.know.courses.push({ id: uid(), title: d.title.trim().slice(0, 120), lessons: [] }); return true; },
  lesson(d, f) {
    const c = find(S.know.courses, f.dataset.id), ls = d.t.split('\n').map(s => s.trim()).filter(Boolean);
    if (!ls.length) return toast('Escreva a aula');
    for (const t of ls) c.lessons.push({ id: uid(), t: t.slice(0, 200), done: false, doneAt: '' });
    return true;
  },
  quote(d) { if (!d.t.trim()) return toast('Escreva a frase'); S.know.quotes.push({ id: uid(), t: d.t.trim().slice(0, 1000), author: d.author.trim().slice(0, 80) }); toast('Frase guardada'); return true; },
  frame(d) { if (!d.t.trim()) return toast('Escreva o quadro'); S.know.frames.push({ id: uid(), t: d.t.trim().slice(0, 120), author: d.author.trim().slice(0, 80), done: false }); return true; },
  niche(d) {
    const name = d.name.trim().slice(0, 30); if (!name) return toast('Escreva o nome da aba');
    const id = uid(); S.know.niches.push({ id, name, type: NICHE_T[d.type] ? d.type : 'outro', buy: d.buy === 'on', items: [] });
    U.know = 'n_' + id; U.sheet = null; toast('Aba ' + name + ' criada'); return true;
  },
  nicheren(d, f) { const name = d.name.trim().slice(0, 30); if (!name) return toast('Escreva o nome'); nicheOf(f.dataset.id).name = name; U.sheet = null; toast('Renomeada'); return true; },
  feed(d) {
    const [c, p] = d.c.trim().replace(/^.*#feed=/, '').split('.'), code = normCode(c);
    if (!code || !p) return toast('Código inválido');
    setFeed({ code, pass: p, v: 0 }); feedLoad(true); toast('Ligado, buscando…');
  },
  async syncjoin(d) {
    const code = normCode(d.code);
    if (!code || !d.pass) return toast('Confira a chave e a senha');
    toast('Conferindo…');
    try { await syncJoin(code, d.pass); toast('Sincronização ligada'); } catch (e) { alert(SYNC_ERR[e.message] || 'Não consegui falar com o servidor. Tem internet?'); }
    render();
  },
  pin(d) {
    if (cfg().pin && hashPin(d.old || '') !== cfg().pin) return toast('Senha atual errada');
    if (cfg().pin && !d.a && !d.b) { delete cfg().pin; delete cfg().pinLen; toast('Senha tirada'); return true; }
    if (!/^\d{4,6}$/.test(d.a)) return toast('A senha precisa ter de 4 a 6 números');
    if (d.a !== d.b) return toast('As duas senhas não são iguais');
    cfg().pin = hashPin(d.a); cfg().pinLen = d.a.length; toast('Senha salva'); return true;
  },
  async syncpass(d) { try { await syncRepass(d.pass); toast('Senha certa'); } catch (e) { alert(SYNC_ERR[e.message] || 'Sem conexão.'); } render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'bg' && e.target !== el) return; // clique dentro da folha
  if (el.dataset.act === 'bg') { U.sheet = null; render(); return; }
  const r = ACT[el.dataset.act] && ACT[el.dataset.act](el.dataset.v, el);
  if (r === true) save();
  render();
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f));
  const r = await FORM[f.dataset.form](d, f);
  if (r === true) { save(); render(); }
  else if (f.dataset.form === 'feed') render();
});
document.addEventListener('change', async e => {
  const i = e.target; if (!i.matches('[data-photo]') || !i.files[0]) return;
  try { find(listOf(i.dataset.k), i.dataset.id).img = await shrinkImg(i.files[0]); save(); render(); toast('Foto salva'); }
  catch (err) { toast('Não consegui ler a foto'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && U.sheet) { U.sheet = null; render(); } });

// ---------- Início ----------
lock();
feedFromHash();
render();
feedLoad(true);
if (syncCfg().on) syncRun();
setInterval(() => { if (document.visibilityState === 'visible') { feedLoad(); if (syncCfg().on) syncRun(); } }, 120000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { feedLoad(); if (syncCfg().on) syncRun(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
